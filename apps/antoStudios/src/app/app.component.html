
<!-- Theme Toggle -->
<button
  class="theme-toggle"
  [class.dark]="currentTheme === 'dark'"
  [class.light]="currentTheme === 'light'"
  (click)="toggleTheme()"
  [attr.aria-label]="currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
  <span class="theme-icon">
    {{ currentTheme === 'dark' ? '🌙' : '☀️' }}
  </span>
</button>

<div *ngIf="loading()">
    <lib-ui-spinner
    [variant]="'cosmic-dust'"
    [size]="'md'"
    [dark]="true"></lib-ui-spinner>

</div>


<div *ngIf="!loading()">
    <router-outlet></router-outlet>

</div>

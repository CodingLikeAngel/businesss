<button
  [ngClass]="buttonClasses()"
  [ngStyle]="buttonStyles()"
  (click)="handleClick($event)"
  [attr.aria-label]="ariaLabel() || 'Button'"
  [attr.aria-disabled]="disabled() ? 'true' : 'false'"
  [attr.aria-expanded]="expanded()"
  [attr.aria-pressed]="pressed()"
  [disabled]="disabled()"
  role="button"
  tabindex="0"
>
  <span class="ripple" [class.active]="rippleActive"></span>
  <span *ngIf="!loading()">
    <ng-icon *ngIf="leadingIcon() && getIconType(leadingIcon()) === 'ng-icon'" [name]="leadingIcon()" class="icon"></ng-icon>
    <span *ngIf="leadingIcon() && getIconType(leadingIcon()) === 'svg'" class="icon" [innerHTML]="leadingIcon()"></span>
    <span *ngIf="leadingIcon() && getIconType(leadingIcon()) === 'text'" class="icon">{{ leadingIcon() }}</span>
    <ng-content></ng-content>
    <ng-icon *ngIf="trailingIcon() && getIconType(trailingIcon()) === 'ng-icon'" [name]="trailingIcon()" class="icon"></ng-icon>
    <span *ngIf="trailingIcon() && getIconType(trailingIcon()) === 'svg'" class="icon" [innerHTML]="trailingIcon()"></span>
    <span *ngIf="trailingIcon() && getIconType(trailingIcon()) === 'text'" class="icon">{{ trailingIcon() }}</span>
  </span>
  <span class="spinner" *ngIf="loading()"></span>
</button>

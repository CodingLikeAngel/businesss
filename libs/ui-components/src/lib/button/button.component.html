<button
  [class]="buttonClasses()"
  [style]="customStyles()"
  (click)="handleClick($event)"
  [attr.aria-label]="ariaLabel() || 'Button'"
  [attr.aria-disabled]="disabled() ? 'true' : 'false'"
  [disabled]="disabled()"
  role="button"
  tabindex="0"
>
  <ng-icon *ngIf="leadingIcon() && isIconClass(leadingIcon())" [name]="leadingIcon()" class="icon"></ng-icon>
  <span *ngIf="leadingIcon() && !isIconClass(leadingIcon())" class="icon">{{ leadingIcon() }}</span>
  <ng-content></ng-content>
  <ng-icon *ngIf="trailingIcon() && isIconClass(trailingIcon())" [name]="trailingIcon()" class="icon"></ng-icon>
  <span *ngIf="trailingIcon() && !isIconClass(trailingIcon())" class="icon">{{ trailingIcon() }}</span>
</button>

<!-- Nav-bar-1: Minimalist Style - Clean Navigation -->
<nav class="nav-bar-1" [class]="navBarClasses()" [style]="navBarStyles()">
  @for (item of items(); track item.id) {
    <a
      class="nav-bar-1-item"
      [class]="itemClasses()(item)"
      [href]="item.href"
      [attr.disabled]="item.disabled ? 'true' : null"
    >
      {{ item.label }}
    </a>
  }
</nav>

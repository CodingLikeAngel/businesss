<div [class]="accordionClasses()" [style]="accordionStyles()">
  <!-- Accordion-3: Modern/Sleek Style - Balanced Design -->
  @for (item of items(); track item.id) {
    <div [class]="itemClasses(item)">
      <button class="accordion-3-header" (click)="toggleItem(item)">
        <span class="accordion-3-title">{{ item.title }}</span>
        <span class="accordion-3-icon" [class.open]="item.isOpen">▼</span>
      </button>
      @if (item.isOpen) {
        <div class="accordion-3-content">
          <p>{{ item.content }}</p>
        </div>
      }
    </div>
  }
</div>

<!-- Chip-3: Modern/Sleek Style - Balanced Design -->
<ng-container [ngSwitch]="interactive()">
  <button
    *ngSwitchCase="true"
    [ngClass]="chipClasses()"
    [ngStyle]="chipStyles()"
    (click)="handleClick($event)"
    (keyup)="handleKeyUp($event)"
    [attr.aria-label]="disabled() ? 'Chip 3 disabled' : 'Chip 3'"
    [attr.aria-disabled]="disabled() ? 'true' : 'false'"
    [attr.aria-pressed]="selected() || multiSelected()"
    [disabled]="disabled()"
    tabindex="0"
  >
    <ng-container *ngIf="avatarSrc()">
      <img [src]="avatarSrc()" class="chip-3-avatar" alt="Avatar" />
    </ng-container>
    <ng-container *ngIf="iconName()">
      <ng-icon [name]="iconName()" class="chip-3-icon chip-3-icon-custom"></ng-icon>
    </ng-container>
    <ng-content></ng-content>
    <ng-icon
      *ngIf="selected()"
      name="heroCheck"
      class="chip-3-icon chip-3-icon-selected"
    ></ng-icon>
    <ng-icon
      *ngIf="removable()"
      name="heroXMark"
      class="chip-3-icon chip-3-icon-remove"
      (click)="handleRemove($event)"
      (keyup)="handleRemoveKeyUp($event)"
      tabindex="0"
      role="button"
      aria-label="Remove chip"
    ></ng-icon>
  </button>
  <span
    *ngSwitchDefault
    [ngClass]="chipClasses()"
    [ngStyle]="chipStyles()"
    [attr.aria-label]="disabled() ? 'Chip 3 disabled' : 'Chip 3'"
    [attr.aria-disabled]="disabled() ? 'true' : 'false'"
    [attr.aria-pressed]="selected() || multiSelected()"
    role="button"
    tabindex="0"
  >
    <ng-container *ngIf="avatarSrc()">
      <img [src]="avatarSrc()" class="chip-3-avatar" alt="Avatar" />
    </ng-container>
    <ng-container *ngIf="iconName()">
      <ng-icon [name]="iconName()" class="chip-3-icon chip-3-icon-custom"></ng-icon>
    </ng-container>
    <ng-content></ng-content>
    <ng-icon
      *ngIf="selected()"
      name="heroCheck"
      class="chip-3-icon chip-3-icon-selected"
    ></ng-icon>
    <ng-icon
      *ngIf="removable()"
      name="heroXMark"
      class="chip-3-icon chip-3-icon-remove"
      (click)="handleRemove($event)"
      (keyup)="handleRemoveKeyUp($event)"
      tabindex="0"
      role="button"
      aria-label="Remove chip"
    ></ng-icon>
  </span>
</ng-container>

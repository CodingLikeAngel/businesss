<span
  [class]="chipClasses()"
  (click)="handleClick($event)"
  (keyup)="handleKeyUp($event)"
  [attr.aria-label]="disabled() ? 'Chip disabled' : 'Chip'"
  [attr.aria-disabled]="disabled() ? 'true' : 'false'"
  role="button"
  tabindex="0"
>
  <ng-content></ng-content>
  <ng-icon
    *ngIf="selected()"
    name="heroCheck"
    class="chip-icon chip-icon-selected"
  ></ng-icon>
  <ng-icon
    *ngIf="removable()"
    name="heroXMark"
    class="chip-icon chip-icon-remove"
    (click)="handleRemove($event)"
    (keyup)="handleRemoveKeyUp($event)"
    tabindex="0"
    role="button"
    aria-label="Remove chip"
  ></ng-icon>
</span>

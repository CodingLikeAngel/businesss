<section [class]="containerClasses">
  <div class="faq-inner">
    <div class="header-content">
      <h2 class="title">{{ title }}</h2>
      <p class="subtitle">{{ subtitle }}</p>
    </div>

    <div class="faq-wrapper">
      <lib-ui-accordion 
        [items]="items"
        [variant]="variant === 'glass' ? 'glass' : 'default'"
        [singleExpand]="true"
        class="faq-item-animate">
      </lib-ui-accordion>
    </div>
  </div>
</section>

<div class="gallery-3" [class]="galleryClasses()" [style]="galleryStyles()">
  @for (item of items(); track item.id) {
    <div class="gallery-3-item" [class]="itemClasses()(item)">
      <img [src]="item.src" [alt]="item.alt || ''" />
      @if (item.caption) {
        <div class="gallery-3-caption">{{ item.caption }}</div>
      }
    </div>
  }
</div>

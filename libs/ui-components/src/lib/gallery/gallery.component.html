<div [ngClass]="hostClasses" [ngStyle]="galleryStyles()">
  <div class="ui-gallery__filters">
    <button *ngFor="let cat of categories()" [class.active]="selectedCategory() === cat" (click)="selectCategory(cat)" [attr.aria-label]="'Filter by ' + cat">{{ cat }}</button>
  </div>
  <div class="ui-gallery__grid">
    <figure *ngFor="let image of filteredImages(); let i = index; trackBy: trackByFn" class="ui-gallery__item" #imageRef (click)="openModal(i)" (mousemove)="onMouseMove($event, $any($event.currentTarget))" (mouseleave)="onMouseLeave($any($event.currentTarget))">
      <picture>
        <img data-src="{{image.src}}" *ngIf="loadedImages().get(image.src)" [src]="image.src" [alt]="image.alt" class="ui-gallery__image" />
      </picture>
      <figcaption *ngIf="image.caption" class="ui-gallery__caption">{{ image.caption }}</figcaption>
    </figure>
  </div>
  <div *ngIf="isModalOpen()" class="ui-gallery__modal" (keydown)="onModalKey($event)" tabindex="0" role="dialog" aria-modal="true" [attr.aria-labelledby]="'modal-image-' + modalImageIndex()">
    <button class="ui-gallery__modal-close" (click)="closeModal()" aria-label="Close modal">×</button>
    <button class="ui-gallery__modal-prev" (click)="prevModal()" aria-label="Previous image">❮</button>
    <img [src]="filteredImages()[modalImageIndex()].src" [alt]="filteredImages()[modalImageIndex()].alt" class="ui-gallery__modal-image" [id]="'modal-image-' + modalImageIndex()" />
    <button class="ui-gallery__modal-next" (click)="nextModal()" aria-label="Next image">❯</button>
    <div class="ui-gallery__modal-caption" *ngIf="filteredImages()[modalImageIndex()].caption">{{ filteredImages()[modalImageIndex()].caption }}</div>
  </div>
</div>

<div [ngClass]="hostClasses" [ngStyle]="customStyles">
  <div class="ui-gallery__slider" #slider>
    <div class="ui-gallery__slide" *ngFor="let image of images; trackBy: trackByFn">
      <lib-ui-image
        [src]="image.src"
        [alt]="image.alt"
        [caption]="image.caption"
        [variant]="variant"
        size="custom"
        width="100%"
        height="auto"
      ></lib-ui-image>
    </div>
  </div>
  <button
    class="ui-gallery__nav ui-gallery__nav--prev"
    (click)="prevSlide()"
    (keydown)="onKeyNav($event)"
    tabindex="0"
  >❮</button>
  <button
    class="ui-gallery__nav ui-gallery__nav--next"
    (click)="nextSlide()"
    (keydown)="onKeyNav($event)"
    tabindex="0"
  >❯</button>
  <div class="ui-gallery__dots">
    <span
      *ngFor="let image of images; let i = index"
      [class.ui-gallery__dot--active]="i === currentIndex"
      class="ui-gallery__dot"
      (click)="goToSlide(i)"
      (keydown)="onKeyDot($event, i)"
      tabindex="0"
    ></span>
  </div>
</div>

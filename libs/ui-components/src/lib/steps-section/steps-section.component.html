
<section class="steps-section" [ngClass]="variant">
  <div class="header">
    <h2>{{ title }}</h2>
    <p *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <div class="steps-container">
    <div *ngFor="let step of steps; let i = index" class="step-item">
      <div class="step-marker">
        <span class="step-number">{{ i + 1 }}</span>
        <div class="step-line" *ngIf="i < steps.length - 1"></div>
      </div>
      <div class="step-content">
        <div class="step-icon" *ngIf="step.icon">{{ step.icon }}</div>
        <h3>{{ step.title }}</h3>
        <p>{{ step.description }}</p>
      </div>
    </div>
  </div>
</section>

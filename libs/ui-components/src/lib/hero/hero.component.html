<section
  [ngClass]="heroClasses"
  [style]="customStyles"
  role="banner"
  [attr.aria-label]="'Sección principal de ' + businessName"
>
  <!-- Background Overlay -->
  <div class="background-overlay" [ngClass]="overlayClass"></div>

  <!-- Particles (variant-dependent) -->
  <div *ngIf="showParticles" class="particle-container" [ngClass]="particleClass">
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <span class="particle-icon particle-icon-1">{{ particleIcon1 }}</span>
    <span class="particle-icon particle-icon-2">{{ particleIcon2 }}</span>
  </div>

  <!-- Main Content -->
  <div class="hero-content" [ngClass]="contentClass">
    <h1 class="hero-title" [ngClass]="titleClass">{{ title }}</h1>
    <p class="hero-subtitle" [ngClass]="subtitleClass">{{ subtitle }}</p>

    <!-- CTA Button -->
    <button
      *ngIf="showCta"
      class="cta-button"
      [ngClass]="ctaClass"
      (click)="onCtaClick()"
      (keydown)="onInteractiveKeydown($event, onCtaClick)"
      [attr.aria-label]="ctaLabel"
    >
      {{ ctaLabel }}
    </button>

    <!-- Development Message -->
    <div *ngIf="showDevelopmentMessage" class="development-message">
      <p class="development-text">¡En desarrollo...!</p>
    </div>
  </div>

  <!-- Dynamic Layouts -->
  <ng-container [ngSwitch]="variant">
    <!-- Primary: Staggered Card Grid with Dynamic Gradient Waves -->
    <div *ngSwitchCase="'primary'" class="navigation-container gradient-wave-bg" role="navigation" aria-label="Navegación principal">
      <div class="navigation-grid">
        <lib-ui-components-card-animated
          *ngFor="let card of navigationCards; let i = index"
          [icon]="card.icon"
          [title]="card.title"
          [description]="card.description"
          [variant]="variant"
          [animationDelay]="(i * 0.2) + 's'"
          [customStyles]="{ 'card': 'cursor-pointer hover:shadow-primary-glow wave-card' }"
          (click)="scrollToSection(card.sectionId)"
          (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
          class="hero-card"
          role="button"
          tabindex="0"
          [attr.aria-label]="card.title"
        >
          <div class="card-decor" slot="decor">
            <span class="wave-ripple"></span>
          </div>
        </lib-ui-components-card-animated>
      </div>
    </div>

    <!-- Secondary: Video Card Carousel with Subtle Glow -->
    <div *ngSwitchCase="'secondary'" class="carousel-container glow-overlay" role="region" aria-label="Carrusel de videos destacados">
      <video
        *ngIf="videoBackground"
        autoplay
        muted
        loop
        class="carousel-video-bg"
        [ngClass]="videoClass"
        [poster]="carouselItems[activeCarouselIndex]?.posterUrl"
      >
        <source [src]="carouselItems[activeCarouselIndex]?.videoUrl" type="video/mp4" />
        Tu navegador no soporta videos.
      </video>
      <div class="carousel">
        <lib-ui-components-card-animated
          *ngFor="let item of carouselItems; let i = index"
          [title]="item.title"
          [description]="item.description"
          [variant]="variant"
          [animationDelay]="(i * 0.1) + 's'"
          [customStyles]="{ 'card': 'carousel-item ' + (i === activeCarouselIndex ? 'active glow-active' : 'glow-hover') }"
          (click)="onCarouselItemClick(item); activeCarouselIndex = i"
          (keydown)="onInteractiveKeydown($event, onCarouselItemClick, item)"
          role="button"
          tabindex="0"
          [attr.aria-label]="item.title"
        >
          <video
            autoplay
            muted
            loop
            class="carousel-video"
            [ngClass]="videoClass"
            [poster]="item.posterUrl"
            slot="media"
          >
            <source [src]="item.videoUrl" type="video/mp4" />
          </video>
        </lib-ui-components-card-animated>
        <button
          class="carousel-control prev"
          (click)="prevCarouselItem()"
          (keydown)="onInteractiveKeydown($event, prevCarouselItem)"
          aria-label="Diapositiva anterior"
        >
          ❮
        </button>
        <button
          class="carousel-control next"
          (click)="nextCarouselItem()"
          (keydown)="onInteractiveKeydown($event, nextCarouselItem)"
          aria-label="Diapositiva siguiente"
        >
          ❯
        </button>
      </div>
    </div>

    <!-- Cyberpunk: Video Background with Neon Pulse Cards -->
    <div *ngSwitchCase="'cyberpunk'" class="video-container neon-pulse-overlay">
      <video
        autoplay
        muted
        loop
        class="hero-video"
        [ngClass]="videoClass"
        [poster]="videoPoster"
      >
        <source [src]="videoUrl" type="video/mp4" />
        Tu navegador no soporta videos.
      </video>
      <div class="video-overlay">
        <div class="navigation-grid">
          <lib-ui-components-card-animated
            *ngFor="let card of navigationCards; let i = index"
            [icon]="card.icon"
            [title]="card.title"
            [description]="card.description"
            [variant]="variant"
            [animationDelay]="(i * 0.2) + 's'"
            [customStyles]="{ 'card': 'cursor-pointer hover:shadow-neon-glow pulse-card' }"
            (click)="scrollToSection(card.sectionId)"
            (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
            class="hero-card"
            role="button"
            tabindex="0"
            [attr.aria-label]="card.title"
          >
            <div class="card-decor" slot="decor">
              <span class="neon-line"></span>
            </div>
          </lib-ui-components-card-animated>
        </div>
      </div>
    </div>

    <!-- Neon: Interactive Form with Video and Sparkle Effect -->
    <div *ngSwitchCase="'neon'" class="form-container sparkle-overlay">
      <video
        *ngIf="videoBackground"
        autoplay
        muted
        loop
        class="form-video-bg"
        [ngClass]="videoClass"
        [poster]="videoPoster"
      >
        <source [src]="videoUrl" type="video/mp4" />
        Tu navegador no soporta videos.
      </video>
      <form class="hero-form" role="form" aria-label="Formulario de suscripción">
        <h3>Suscríbete al Futuro</h3>
        <input
          type="email"
          placeholder="Tu correo electrónico"
          required
          aria-label="Correo electrónico"
          [ngClass]="inputClass"
        />
        <button
          type="submit"
          (click)="onFormSubmit()"
          (keydown)="onInteractiveKeydown($event, onFormSubmit)"
          [ngClass]="formButtonClass"
          aria-label="Enviar suscripción"
        >
          Enviar
        </button>
      </form>
    </div>

    <!-- Matrix: Code Rain with 3D Flip Cards -->
    <div *ngSwitchCase="'matrix'" class="matrix-container glitch-canvas">
      <canvas class="matrix-canvas" #matrixCanvas aria-hidden="true"></canvas>
      <div class="matrix-content">
        <div class="navigation-grid">
          <lib-ui-components-card-animated
            *ngFor="let card of navigationCards; let i = index"
            [icon]="card.icon"
            [title]="card.title"
            [description]="card.description"
            [variant]="variant"
            [animationDelay]="(i * 0.2) + 's'"
            [customStyles]="{ 'card': 'cursor-pointer hover:shadow-matrix-glow 3d-flip-card' }"
            (click)="scrollToSection(card.sectionId)"
            (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
            class="hero-card"
            role="button"
            tabindex="0"
            [attr.aria-label]="card.title"
          >
            <div class="card-decor" slot="decor">
              <span class="glitch-text">{{ card.title.charAt(0) }}</span>
            </div>
          </lib-ui-components-card-animated>
        </div>
      </div>
    </div>

    <!-- Stellar: Starfield with Video and Orbital Cards -->
    <div *ngSwitchCase="'stellar'" class="starfield-container orbit-overlay">
      <video
        *ngIf="videoBackground"
        autoplay
        muted
        loop
        class="starfield-video-bg"
        [ngClass]="videoClass"
        [poster]="videoPoster"
      >
        <source [src]="videoUrl" type="video/mp4" />
        Tu navegador no soporta videos.
      </video>
      <div class="starfield"></div>
      <div class="floating-cards">
        <lib-ui-components-card-animated
          *ngFor="let card of navigationCards; let i = index"
          [icon]="card.icon"
          [title]="card.title"
          [description]="card.description"
          [variant]="variant"
          [animationDelay]="(i * 0.3) + 's'"
          [customStyles]="{ 'card': 'floating-card hover:shadow-stellar-glow orbit-card' }"
          (click)="scrollToSection(card.sectionId)"
          (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
          role="button"
          tabindex="0"
          [attr.aria-label]="card.title"
        >
          <div class="card-decor" slot="decor">
            <span class="orbit-path"></span>
          </div>
        </lib-ui-components-card-animated>
      </div>
    </div>

    <!-- Retro: Pixelated Menu with CRT Scanlines -->
    <div *ngSwitchCase="'retro'" class="retro-container crt-scanline-bg">
      <div class="retro-menu">
        <lib-ui-components-card-animated
          *ngFor="let card of navigationCards; let i = index"
          [icon]="card.icon"
          [title]="card.title"
          [description]="card.description"
          [variant]="variant"
          [animationDelay]="(i * 0.2) + 's'"
          [customStyles]="{ 'card': 'retro-item ' + (i === activeRetroIndex ? 'selected scanline-active' : 'scanline-hover') }"
          (click)="scrollToSection(card.sectionId)"
          (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
          role="button"
          tabindex="0"
          [attr.aria-label]="card.title"
        >
          <div class="card-decor" slot="decor">
            <span class="pixel-frame"></span>
          </div>
        </lib-ui-components-card-animated>
        <div class="retro-controls">
          <button
            (click)="prevRetroItem()"
            (keydown)="onInteractiveKeydown($event, prevRetroItem)"
            aria-label="Menú anterior"
            class="retro-button"
          >
            ↑
          </button>
          <button
            (click)="nextRetroItem()"
            (keydown)="onInteractiveKeydown($event, nextRetroItem)"
            aria-label="Menú siguiente"
            class="retro-button"
          >
            ↓
          </button>
        </div>
      </div>
    </div>

    <!-- Phoenix: Animated Flame Video with Ember Cards -->
    <div *ngSwitchCase="'phoenix'" class="flame-container ember-overlay">
      <video
        *ngIf="videoBackground"
        autoplay
        muted
        loop
        class="flame-video-bg"
        [ngClass]="videoClass"
        [poster]="videoPoster"
      >
        <source [src]="videoUrl" type="video/mp4" />
        Your browser does not support videos.
      </video>
      <div class="flame-grid">
        <lib-ui-components-card-animated
          *ngFor="let card of navigationCards; let i = index"
          [icon]="card.icon"
          [title]="card.title"
          [description]="card.description"
          [variant]="variant"
          [animationDelay]="(i * 0.2) + 's'"
          [customStyles]="{ 'card': 'flame-card hover:shadow-phoenix-glow ember-card' }"
          (click)="scrollToSection(card.sectionId)"
          (keydown)="onInteractiveKeydown($event, scrollToSection, card.sectionId)"
          role="button"
          tabindex="0"
          [attr.aria-label]="card.title"
        >
          <div class="card-decor" slot="decor">
            <span class="ember-glow"></span>
          </div>
        </lib-ui-components-card-animated>
      </div>
    </div>

    <!-- Default: Holographic Card Gallery -->
    <div *ngSwitchDefault class="gallery-container holo-grid-bg">
      <div class="gallery-grid">
        <lib-ui-components-card-animated
          *ngFor="let item of carouselItems; let i = index"
          [title]="item.title"
          [description]="item.description"
          [variant]="variant"
          [animationDelay]="(i * 0.2) + 's'"
          [customStyles]="{ 'card': 'gallery-item hover:shadow-gallery-glow holo-card' }"
          (click)="onGalleryItemClick(item)"
          (keydown)="onInteractiveKeydown($event, onGalleryItemClick, item)"
          role="button"
          tabindex="0"
          [attr.aria-label]="item.title"
        >
          <div class="card-decor" slot="decor">
            <span class="holo-shimmer"></span>
          </div>
        </lib-ui-components-card-animated>
      </div>
    </div>
  </ng-container>

  <!-- Scroll Icon -->
  <div *ngIf="showScrollIcon" class="scroll-icon" [ngClass]="scrollIconClass">
    <svg class="scroll-icon-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</section>

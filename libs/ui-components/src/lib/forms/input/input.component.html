<fieldset class="input-fieldset" [class.input-error]="isValid() === false" [class.input-success]="isValid() === true">
  <legend *ngIf="legend()" class="input-legend">{{legend()}}</legend>
  <div class="input-wrapper">
    <div class="input-container" [class.checkbox-layout]="type() === 'checkbox'">
      <ng-container [ngSwitch]="type()">
        <!-- Text input -->
        <div *ngSwitchCase="'text'" class="input-group">
          <input
            [type]="type()"
            [value]="value"
            (input)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [placeholder]="placeholder()"
            [disabled]="disabled"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.list]="options().length > 0 ? 'datalist-text' : null"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="input"
          />
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>

        <!-- Email input -->
        <div *ngSwitchCase="'email'" class="input-group">
          <input
            [type]="type()"
            [value]="value"
            (input)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [placeholder]="placeholder()"
            [disabled]="disabled"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="input"
          />
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>

        <!-- Datetime-local input -->
        <div *ngSwitchCase="'datetime-local'" class="input-group">
          <input
            [type]="type()"
            [value]="value"
            (input)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [disabled]="disabled"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="input"
          />
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>

        <!-- Checkbox input -->
        <input
          *ngSwitchCase="'checkbox'"
          type="checkbox"
          [checked]="value"
          (change)="onInputChange($event)"
          [disabled]="disabled"
          [class]="'input input-' + variant() + ' input-' + size()"
          [class.input-disabled]="disabled"
          [ngStyle]="inputStyles()"
          tag="input"
        />
        <span *ngIf="type() === 'checkbox' && label()" class="checkbox-label">{{label()}}</span>

        <!-- Select -->
        <div *ngSwitchCase="'select'" class="input-group">
          <select
            [value]="value"
            (change)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [disabled]="disabled"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="select"
          >
            <option value="" disabled selected>{{ placeholder() || 'Selecciona una opción' }}</option>
            <option *ngFor="let option of options()" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>

        <!-- Textarea -->
        <div *ngSwitchCase="'textarea'" class="input-group">
          <textarea
            [value]="value"
            (input)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [placeholder]="placeholder()"
            [disabled]="disabled"
            [rows]="rows() || 4"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="textarea"
          ></textarea>
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>

        <!-- Fallback -->
        <div *ngSwitchDefault class="input-group">
          <input
            [type]="type()"
            [value]="value"
            (input)="onInputChange($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
            [placeholder]="placeholder()"
            [disabled]="disabled"
            [class]="'input input-' + variant() + ' input-' + size()"
            [class.input-disabled]="disabled"
            [ngStyle]="inputStyles()"
            [attr.aria-describedby]="errorMessage() ? errorId : null"
            tag="input"
          />
          <label *ngIf="label()" class="floating-label" [class.floated]="isFloated()">{{label()}}</label>
          <div *ngIf="icon()" class="input-icon">
            <i [class]="icon()"></i>
          </div>
        </div>
      </ng-container>
      <datalist *ngIf="type() === 'text' && options().length > 0" id="datalist-text">
        <option *ngFor="let option of options()" [value]="option.value">
      </datalist>
    </div>
    <div *ngIf="errorMessage()" class="error-message" [id]="errorId" role="alert" aria-live="polite">{{errorMessage()}}</div>
    <div *ngIf="successMessage()" class="success-message">{{successMessage()}}</div>
  </div>
</fieldset>

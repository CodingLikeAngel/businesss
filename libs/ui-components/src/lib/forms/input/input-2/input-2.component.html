<!-- Input-2: Bold/Prominent Style - Strong Visual Presence -->
<fieldset class="input-2-fieldset" 
          [class.input-2-error]="isValid() === false" 
          [class.input-2-success]="isValid() === true"
          [class.has-label]="label()"
          [class.has-floating-label]="showFloatingLabel() && ['text', 'email', 'password', 'number', 'tel', 'url', 'date', 'time', 'datetime-local', 'select', 'textarea'].includes(type())">
  
  <legend *ngIf="legend()" class="input-2-legend">{{legend()}}</legend>
  
  <div class="input-2-wrapper" [class.is-focused]="isFocused" [class.is-floated]="isFloated()">
    
    <label *ngIf="label() && (!showFloatingLabel() || ['checkbox', 'radio', 'range', 'color'].includes(type()))" 
           [for]="name() || errorId" 
           class="input-2-static-label">
      {{label()}}
    </label>

    <div class="input-2-control-outer" [ngSwitch]="type()">
      
      <div *ngSwitchCase="'checkbox'" class="input-2-selection-control input-2-checkbox">
        <input type="checkbox" [id]="name() || errorId" [checked]="value" (change)="onInputChange($event)" [disabled]="disabled" class="input-2-real-input">
        <div class="input-2-control-indicator"></div>
        <span class="input-2-control-label" *ngIf="label()">{{label()}}</span>
      </div>

      <div *ngSwitchCase="'radio'" class="input-2-selection-control input-2-radio">
        <div class="input-2-radio-options" *ngIf="options().length > 0; else singleRadio">
          <label *ngFor="let opt of options(); let i = index" class="input-2-radio-item">
            <input type="radio" [name]="name()" [value]="opt.value" [checked]="value === opt.value" (change)="onInputChange($event)" [disabled]="disabled" class="input-2-real-input">
            <div class="input-2-control-indicator"></div>
            <span class="input-2-control-label">{{opt.label}}</span>
          </label>
        </div>
        <ng-template #singleRadio>
          <input type="radio" [id]="name() || errorId" [checked]="value" (change)="onInputChange($event)" [disabled]="disabled" class="input-2-real-input">
          <div class="input-2-control-indicator"></div>
          <span class="input-2-control-label" *ngIf="label()">{{label()}}</span>
        </ng-template>
      </div>

      <div *ngSwitchCase="'range'" class="input-2-range-control">
        <input type="range" [value]="value" (input)="onInputChange($event)" [disabled]="disabled" class="input-2 input-2-range-input" [ngStyle]="inputStyles()">
        <span class="input-2-range-value">{{value}}</span>
      </div>

      <div *ngSwitchCase="'color'" class="input-2-color-control">
        <input type="color" [value]="value" (input)="onInputChange($event)" [disabled]="disabled" class="input-2 input-2-color-input" [ngStyle]="inputStyles()">
        <span class="input-2-color-hex">{{value}}</span>
      </div>

      <div *ngSwitchCase="'select'" class="input-2-input-group">
        <select [id]="name() || errorId" [value]="value" (change)="onInputChange($event)" (focus)="onFocus()" (blur)="onBlur()" [disabled]="disabled" class="input-2 input-2-select-input" [ngStyle]="inputStyles()">
          <option value="" disabled selected>{{ placeholder() || 'Selecciona una opción' }}</option>
          <option *ngFor="let option of options()" [value]="option.value">{{ option.label }}</option>
        </select>
        <label *ngIf="label() && showFloatingLabel()" class="input-2-floating-label">{{label()}}</label>
        <div class="input-2-select-arrow"></div>
      </div>

      <div *ngSwitchCase="'textarea'" class="input-2-input-group">
        <textarea [id]="name() || errorId" [value]="value" (input)="onInputChange($event)" (focus)="onFocus()" (blur)="onBlur()" [placeholder]="!showFloatingLabel() ? placeholder() : ''" [disabled]="disabled" [rows]="rows()" class="input-2 input-2-textarea-input" [ngStyle]="inputStyles()"></textarea>
        <label *ngIf="label() && showFloatingLabel()" class="input-2-floating-label">{{label()}}</label>
        <div *ngIf="icon()" class="input-2-input-icon"><i [class]="icon()"></i></div>
      </div>

      <div *ngSwitchDefault class="input-2-input-group">
        <input [type]="type()" [id]="name() || errorId" [value]="value" (input)="onInputChange($event)" (focus)="onFocus()" (blur)="onBlur()" [placeholder]="!showFloatingLabel() ? placeholder() : ''" [disabled]="disabled" class="input-2 input-2-default-input" [ngStyle]="inputStyles()" [attr.list]="options().length > 0 ? 'datalist-' + errorId : null">
        <label *ngIf="label() && showFloatingLabel()" class="input-2-floating-label">{{label()}}</label>
        <div *ngIf="icon()" class="input-2-input-icon"><i [class]="icon()"></i></div>
        
        <datalist *ngIf="options().length > 0" [id]="'datalist-' + errorId">
          <option *ngFor="let option of options()" [value]="option.value">{{option.label}}</option>
        </datalist>
      </div>

    </div>

    <div class="input-2-feedback-area">
      <div *ngIf="errorMessage()" class="input-2-error-message" [id]="errorId" role="alert">{{errorMessage()}}</div>
      <div *ngIf="successMessage()" class="input-2-success-message">{{successMessage()}}</div>
    </div>

  </div>
</fieldset>

<div class="tabs-3-wrapper">
  <div class="tabs-3" [class]="tabsClasses()" [style]="tabsStyles()">
    @for (tab of tabs(); track tab.id) {
      <button
        class="tabs-3-tab"
        [class]="tabClasses()(tab)"
        [disabled]="tab.disabled"
        [attr.aria-selected]="tab.id === activeTab()"
        [attr.aria-controls]="'tab-' + tab.id"
        [attr.id]="'tab-' + tab.id"
      >
        {{ tab.label }}
      </button>
    }
  </div>
</div>

<!-- image.component.html -->
<div [ngClass]="imageClasses()" [ngStyle]="imageStyles()">
  <img
    [src]="src()"
    [alt]="alt()"
    class="image"
    [style.object-fit]="'var(--img-fit, cover)'"
    [style.object-position]="'var(--img-position, center)'"
  />
  <figcaption *ngIf="caption()" class="image-caption">{{ caption() }}</figcaption>
</div>

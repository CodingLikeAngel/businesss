<section [class]="containerClasses">
  <div class="pricing-inner">
    <div class="header-content">
      <h2 class="title">{{ title }}</h2>
      <p class="subtitle">{{ subtitle }}</p>
    </div>

    <div class="table-wrapper">
      <lib-ui-table
        [variant]="tableVariant"
        [columns]="columns"
        [rows]="rows"
        [dark]="true"
        [size]="'lg'"
        [rounded]="'md'"
      ></lib-ui-table>
    </div>
  </div>
</section>

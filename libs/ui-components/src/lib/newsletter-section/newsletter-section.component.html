
<section class="newsletter-section" [ngClass]="variant">
  <div class="content">
    <div class="text-content">
      <h2>{{ title }}</h2>
      <p>{{ description }}</p>
    </div>
    <div class="form-container">
      <div class="input-wrapper">
         <lib-ui-components-input 
            [type]="'email'" 
            [placeholder]="placeholder" 
            [(ngModel)]="email" 
            [variant]="'glass'">
         </lib-ui-components-input>
      </div>
      <lib-ui-components-button 
        [variant]="'primary'" 
        [disabled]="isSubmitting"
        (buttonClick)="onSubmit()">
        {{ isSubmitting ? '...' : buttonText }}
      </lib-ui-components-button>
    </div>
    <div class="success-msg" *ngIf="successMessage">
        {{ successMessage }}
    </div>
  </div>
</section>

<div [class]="chartClasses()" [style]="chartStyles()">
  <div class="chart-3-header">
    <h3 class="chart-3-title">{{ title() }}</h3>
  </div>
  <div class="chart-3-body">
    @for (point of data(); track point.label) {
      <div class="chart-3-bar-container">
        <div class="chart-3-bar" [style.height.%]="(point.value / maxValue()) * 100"></div>
        <span class="chart-3-label">{{ point.label }}</span>
        <span class="chart-3-value">{{ point.value }}</span>
      </div>
    }
  </div>
</div>

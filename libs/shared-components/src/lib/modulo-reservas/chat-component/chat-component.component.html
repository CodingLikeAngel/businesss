<div class="flex flex-col h-[500px] w-full max-w-md mx-auto border border-gray-200 rounded-lg shadow-lg bg-white">
  <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
    <div
      *ngFor="let message of chatMessages"
      class="flex flex-col max-w-[80%] p-3 rounded-lg"
      [ngClass]="{
        'bg-blue-600 text-white ml-auto': message.sender === 'user',
        'bg-gray-200 text-gray-800 mr-auto': message.sender === 'bot'
      }"
    >
      <span class="text-xs text-gray-500 mb-1">{{ message.timestamp }}</span>
      <p class="text-sm">{{ message.text }}</p>
    </div>
  </div>
  <div class="flex items-center p-4 border-t border-gray-200 bg-white">
    <lib-ui-input
      [(ngModel)]="userInput"
      (ngModelChange)="userInput = $event"
      (keyup.enter)="sendMessage()"
      placeholder="Escribe un comando..."
      variant="primary"
      size="md"
      type="text"
      class="flex-1 mr-2"
    ></lib-ui-input>
    <lib-ui-button
      variant="primary"
      size="md"
      (buttonClick)="sendMessage()"
      trailingIcon="heroArrowRight"
      class="px-4 py-2"
    >
      Enviar
    </lib-ui-button>
  </div>
</div>

<!-- Botón compacto para abrir el modal -->
<button class="template-trigger-btn" (click)="openModal()" title="Seleccionar Template">
  <span class="template-icon-btn">🎨</span>
  <span class="template-text">Templates</span>
</button>

<!-- Modal -->
<div *ngIf="showModal" class="template-modal-overlay" (click)="closeModal()">
  <div class="template-modal" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <div class="header-content">
        <div class="header-icon">🎨</div>
        <div class="header-text">
          <h2>Plantillas de Negocio</h2>
          <p>Selecciona un template predefinido para comenzar rápidamente.</p>
        </div>
      </div>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>

    <!-- Category Filter -->
    <div class="category-filter">
      <button 
        class="category-chip" 
        [class.active]="selectedCategory === null"
        (click)="selectCategory(null)">
        Todos
      </button>
      <button 
        *ngFor="let category of categories"
        class="category-chip"
        [class.active]="selectedCategory === category"
        (click)="selectCategory(category)">
        {{ category }}
      </button>
    </div>

    <!-- Templates Grid -->
    <div class="templates-grid">
      <div 
        *ngFor="let template of getTemplatesByCategory()"
        class="template-card"
        [class.selected]="selectedTemplate?.id === template.id"
        (click)="selectTemplate(template)">
        <div class="template-icon">{{ template.icon }}</div>
        <div class="template-info">
          <h3>{{ template.name }}</h3>
          <p>{{ template.description }}</p>
          <span class="template-badge">{{ template.category }}</span>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeModal()">Cancelar</button>
      <button 
        class="btn-apply" 
        [disabled]="!selectedTemplate"
        (click)="applyTemplate()">
        Aplicar Template
      </button>
    </div>
  </div>
</div>

<lib-bubble-animation [variant]="selectedVariant"></lib-bubble-animation>

<lib-forest-animation
  [variant]="selectedForestVariant()"
  [backgroundColor]="'rgba(11, 61, 11, 0.5)'"
  [mistEnabled]="true"
  [treeCount]="5"
  [mushroomCount]="3"
  [fireflyCount]="10"
  [leafCount]="6"
  [sporeCount]="5"
  [butterflyCount]="2"
  [lightBeamCount]="2"
  [lumCount]="2"
  [lianaCount]="0"
>
  

<div class="relative min-h-screen overflow-hidden z-30">
    <div class="container mx-auto px-4 py-12 relative z-30">
      <section id="contacto" class="mb-12 relative z-10">
        <div class="bg-[rgba(255,255,255,0.1)] backdrop-blur-md p-6 rounded-lg">
          <lib-ui-components-title
            level="h2"
            text="Contáctanos"
            [variant]="selectedVariant"
            animation="bounce"
            align="center"
          ></lib-ui-components-title>
          <div class="z-50 px-4 py-12">
            <lib-contact-form [variant]="selectedVariant"></lib-contact-form>
          </div>
        </div>
      </section>
    </div>
  </div>
</lib-forest-animation>

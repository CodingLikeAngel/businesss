<router-outlet></router-outlet>

<!-- NAVIGATION -->
<div class="relative z-30">
  <lib-ui-components-nav-bar
    [variant]="getVariant('navbar')"
    [navLinks]="navBarConfig.navLinks"
    [customStyles]="navBarConfig.customStyles"
    (linkClicked)="scrollToSection($event)"
  ></lib-ui-components-nav-bar>
</div>

<!-- HERO SECTION -->
<section id="hero" class="relative z-20">
  <lib-ui-hero-section
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero-section>
</section>

<!-- STATS SECTION -->
<section id="stats" class="relative z-20 py-16 bg-slate-900/10">
  <lib-ui-components-stats-section
    [title]="'Bienestar en Cifras'"
    [subtitle]="'Resultados reales en relajación y cuidado personal.'"
    [variant]="'glass'"
    [stats]="spaStats"
  ></lib-ui-components-stats-section>
</section>

<!-- FEATURES (WHY US) -->
<section id="features" class="relative z-20 py-24">
  <div class="container mx-auto px-6">
    <lib-ui-features-section
      [title]="'Santuario de Paz'"
      [subtitle]="'Un espacio diseñado para reconectar cuerpo y mente.'"
      [features]="spaFeatures"
      [variant]="'cards'"
    ></lib-ui-features-section>
  </div>
</section>

<!-- SERVICES -->
<section id="servicios" class="relative z-20 py-20 bg-white/50">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Rituales de Belleza"
      [variant]="getVariant('title')"
      align="center"
      class="mb-16"
    ></lib-ui-components-title>
    
    <lib-ui-components-card-rutas
      [items]="serviceCards"
      [variant]="getVariant('card')"
      [backgroundColor]="'rgba(255, 255, 255, 0.8)'"
      [isMobile]="false"
    ></lib-ui-components-card-rutas>
  </div>
</section>

<!-- PROMOTIONS -->
<section id="promociones" class="relative z-20 py-24">
  <div class="container mx-auto px-6 max-w-7xl">
     <lib-promotions-section 
        [variant]="'banner'" 
        [items]="premiumCardConfigs"
        [title]="'Experiencias Exclusivas'"
     ></lib-promotions-section>
  </div>
</section>

<!-- PRICING TABLE -->
<section id="precios" class="relative z-20 py-20 bg-stone-50/50 backdrop-blur-md">
  <div class="container mx-auto px-6 max-w-5xl">
    <lib-ui-components-title
      level="h2"
      text="Menú de Tratamientos"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <div class="glass-panel p-8">
        <lib-ui-pricing-table-section 
            [variant]="'minimal'" 
            [columns]="priceColumns" 
            [rows]="priceRows"
        ></lib-ui-pricing-table-section>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonios" class="relative z-20 py-24">
    <lib-ui-testimonials-section
      [title]="'Voces de Calma'"
      [subtitle]="'Lo que sienten quienes nos visitan.'"
      [variant]="'default'"
      [testimonials]="spaTestimonials"
    ></lib-ui-testimonials-section>
</section>

<!-- GALLERY -->
<section id="galeria" class="relative z-20 py-20 bg-stone-100/30">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Nuestros Espacios"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <lib-ui-components-gallery-section 
        [variant]="'carousel'" 
        [images]="allGalleryConfigs[0].images"
    ></lib-ui-components-gallery-section>
  </div>
</section>

<!-- FAQ -->
<section id="faq" class="relative z-20 py-20">
  <div class="container mx-auto px-6 max-w-4xl">
    <lib-ui-faq-section 
        [variant]="'accordion'" 
        [items]="faqItems"
    ></lib-ui-faq-section>
  </div>
</section>

<!-- BOOKING FORM -->
<section id="forms" class="relative z-20 py-24 bg-gradient-to-b from-transparent to-stone-200">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="glass-panel p-12">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-serif text-gray-800 mb-4">Reserva tu Momento</h2>
            <p class="text-gray-600">El primer paso hacia tu bienestar empieza aquí.</p>
        </div>
        <lib-reservation-form [variant]="'default'"></lib-reservation-form>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<section id="productos" class="relative z-20 py-24">
    <lib-products-section
        [title]="'Cosmética Natural'"
        [subtitle]="'Lleva la experiencia del spa a tu hogar.'"
        [products]="products"
        [variant]="'default'"
    ></lib-products-section>
</section>

<!-- NEWSLETTER -->
<section class="relative z-20 py-16 bg-teal-700/80 text-white">
    <lib-ui-newsletter-section
        [title]="'Club Bienestar'"
        [description]="'Consejos de salud, eventos de yoga y promociones para suscriptores.'"
        [variant]="'glass'"
    ></lib-ui-newsletter-section>
</section>

<!-- FOOTER -->
<lib-ui-components-footer
  [variant]="getVariant('footer')"
  [title]="footerConfig.title"
  [description]="footerConfig.description"
  [exploreLinks]="footerConfig.exploreLinks"
  [trendLinks]="footerConfig.trendLinks"
  [socialIcons]="footerConfig.socialIcons"
  [copyrightText]="footerConfig.copyrightText"
  [showParticles]="footerConfig.showParticles"
  [dark]="footerConfig.dark"
  [customStyles]="footerConfig.customStyles"
  (linkClicked)="scrollToSection($event)"
  (socialClicked)="onSocialClick($event)"
></lib-ui-components-footer>

<lib-bubble-animation [config]="bubbleConfig" [variant]="getVariant('bubble')"></lib-bubble-animation>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles'"
  [content]="selectedService?.description"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

<router-outlet></router-outlet>

<!-- NAVIGATION -->
<div class="relative z-30">
  <lib-ui-components-nav-bar
    [variant]="getVariant('navbar')"
    [navLinks]="navBarConfig.navLinks"
    [customStyles]="navBarConfig.customStyles"
    (linkClicked)="scrollToSection($event)"
  ></lib-ui-components-nav-bar>
</div>

<!-- HERO SECTION -->
<section id="hero" class="relative z-20">
  <lib-ui-hero-section
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [showCta]="heroConfig.showCta"
    [ctaLabel]="heroConfig.ctaLabel"
    [showScrollIcon]="heroConfig.showScrollIcon"
    [videoBackground]="heroConfig.videoBackground"
    [videoUrl]="heroConfig.videoUrl"
    [videoPoster]="heroConfig.videoPoster"
    [navigationCards]="heroConfig.navigationCards"
    [carouselItems]="heroConfig.carouselItems"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero-section>
</section>

<!-- STATS SECTION -->
<section id="stats" class="relative z-20 py-16 bg-slate-950/40">
  <lib-ui-components-stats-section
    [title]="'Pasión en Cifras'"
    [subtitle]="'Nuestra trayectoria dedicada a la excelencia en cada bocado.'"
    [variant]="'neon'"
    [stats]="restaurantStats"
  ></lib-ui-components-stats-section>
</section>

<!-- FEATURES (WHY US) -->
<section id="features" class="relative z-20 py-24">
  <div class="container mx-auto px-6">
    <lib-ui-features-section
      [title]="'Experiencia Gastronómica'"
      [subtitle]="'Lo que nos hace diferentes, desde la granja hasta tu plato.'"
      [features]="restaurantFeatures"
      [variant]="'cards'"
    ></lib-ui-features-section>
  </div>
</section>

<!-- SERVICES (DINING TYPES) -->
<section id="servicios" class="relative z-20 py-20 bg-black/40">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Nuestras Propuestas"
      [variant]="getVariant('title')"
      align="center"
      class="mb-16"
    ></lib-ui-components-title>
    
    <lib-ui-components-card-rutas
      [items]="serviceCards"
      [variant]="getVariant('card')"
      [backgroundColor]="'rgba(39, 39, 42, 0.5)'"
      [isMobile]="false"
    ></lib-ui-components-card-rutas>
  </div>
</section>

<!-- MENU HIGHLIGHTS (PRODUCTS) -->
<section id="productos" class="relative z-20 py-24">
    <lib-products-section
        [title]="'Nuestra Selección del Chef'"
        [subtitle]="'Platos emblemáticos que capturan la esencia de nuestra cocina.'"
        [products]="products"
        [variant]="'glass'"
    ></lib-products-section>
</section>

<!-- PROMOTIONS -->
<section id="promociones" class="relative z-20 py-16">
  <div class="container mx-auto px-6 max-w-6xl flex justify-center">
      <lib-promotions-section
        [variant]="'banner'"
        [items]="premiumCardConfigs"
        [title]="'Experiencias Exclusivas'"
      ></lib-promotions-section>
  </div>
</section>

<!-- PRICING / SET MENUS -->
<section id="tarifas" class="relative z-20 py-20 bg-slate-900/50 backdrop-blur-md">
  <div class="container mx-auto px-6 max-w-4xl">
    <lib-ui-components-title
      level="h2"
      text="Menús de Temporada"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <div class="glass-panel p-8">
        <lib-ui-pricing-table-section 
            [variant]="'minimal'" 
            [columns]="priceColumns" 
            [rows]="priceRows"
        ></lib-ui-pricing-table-section>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonios" class="relative z-20 py-24">
    <lib-ui-testimonials-section
      [title]="'Opiniones de Comensales'"
      [subtitle]="'Ecos de satisfacción que nos impulsan a seguir mejorando.'"
      [variant]="'glow'"
      [testimonials]="restaurantTestimonials"
    ></lib-ui-testimonials-section>
</section>

<!-- GALLERY -->
<section id="salon" class="relative z-20 py-20 bg-black/20">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Ambiente y Salones"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <lib-ui-components-gallery-section 
        [variant]="'carousel'" 
        [images]="allGalleryConfigs[0].images"
    ></lib-ui-components-gallery-section>
  </div>
</section>

<!-- FAQ -->
<section id="faq" class="relative z-20 py-20">
  <div class="container mx-auto px-6 max-w-3xl">
    <lib-ui-faq-section 
        [variant]="'glass'" 
        [items]="faqItems"
    ></lib-ui-faq-section>
  </div>
</section>

<!-- RESERVATION FORM -->
<section id="reserva" class="relative z-20 py-24 bg-gradient-to-b from-transparent to-black">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="glass-panel p-12">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-serif text-white mb-4">Asegure su mesa</h2>
            <p class="text-dim text-lg">Un mundo de sabores le espera. Reserve ahora su experiencia.</p>
        </div>
        <lib-reservation-form [variant]="'luxury'"></lib-reservation-form>
    </div>
  </div>
</section>

<!-- NEWSLETTER -->
<section class="relative z-20 py-16 bg-red-900/80">
    <lib-ui-newsletter-section
        [title]="'Club Gourmet'"
        [description]="'Sea el primero en conocer nuestros menús degustación y eventos privados.'"
        [variant]="'glass'"
    ></lib-ui-newsletter-section>
</section>

<!-- FOOTER -->
<lib-ui-components-footer
  [variant]="getVariant('footer')"
  [title]="footerConfig.title"
  [description]="footerConfig.description"
  [exploreLinks]="footerConfig.exploreLinks"
  [trendLinks]="footerConfig.trendLinks"
  [socialIcons]="footerConfig.socialIcons"
  [copyrightText]="footerConfig.copyrightText"
  [showParticles]="footerConfig.showParticles"
  [dark]="footerConfig.dark"
  [customStyles]="footerConfig.customStyles"
  (linkClicked)="scrollToSection($event)"
  (socialClicked)="onSocialClick($event)"
></lib-ui-components-footer>

<lib-bubble-animation [config]="bubbleConfig" [variant]="getVariant('bubble')"></lib-bubble-animation>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles'"
  [content]="selectedService?.description"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

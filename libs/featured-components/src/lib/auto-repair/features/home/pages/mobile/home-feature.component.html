<lib-ui-components-nav-bar
  [variant]="getVariant('navBar')"
  [navLinks]="navBarConfig.navLinks"
  [customStyles]="navBarConfig.customStyles"
></lib-ui-components-nav-bar>

<lib-ui-hero-section
  [variant]="getVariant('hero')"
  [title]="heroConfig.title"
  [subtitle]="heroConfig.subtitle"
  [showCta]="heroConfig.showCta"
  [ctaLabel]="heroConfig.ctaLabel"
  [showScrollIcon]="heroConfig.showScrollIcon"
  [videoBackground]="heroConfig.videoBackground"
  [videoUrl]="heroConfig.videoUrl"
  [videoPoster]="heroConfig.videoPoster"
  [navigationCards]="heroConfig.navigationCards"
  [carouselItems]="heroConfig.carouselItems"
  [customStyles]="heroConfig.customStyles"
></lib-ui-hero-section>

<lib-ui-components-title [variant]="getVariant('title')">Nuestros Servicios</lib-ui-components-title>

<div class="services-grid">
  <lib-ui-components-card-rutas
    [items]="serviceCards"
    [variant]="getVariant('card')"
  ></lib-ui-components-card-rutas>
</div>

<lib-ui-components-title [variant]="getVariant('title')">Productos Destacados</lib-ui-components-title>

<div class="products-grid">
  <div class="product-card" *ngFor="let product of products; trackBy: trackByProductId">
    <img [src]="product.image" [alt]="product.name" class="product-image" />
    <h3>{{ product.name }}</h3>
    <p>{{ product.description }}</p>
    <p class="price">{{ product.price }}</p>
    <button (click)="addToCart(product)" class="add-to-cart">Añadir al carrito</button>
  </div>
</div>

<lib-ui-faq-section [items]="faqItems" [variant]="getVariant('faq')"></lib-ui-faq-section>

<lib-ui-pricing-table-section [columns]="priceColumns" [rows]="priceRows" [variant]="getVariant('pricing')"></lib-ui-pricing-table-section>

<lib-ui-components-gallery-section [images]="allGalleryConfigs[0].images" [variant]="getVariant('gallery')"></lib-ui-components-gallery-section>

<lib-promotions-section [items]="premiumCardConfigs" [variant]="getVariant('promotions')"></lib-promotions-section>

<lib-reservation-form [variant]="getVariant('reservation')"></lib-reservation-form>

<lib-bubble-animation [config]="bubbleConfig" [variant]="getVariant('bubble')"></lib-bubble-animation>

<div class="min-h-screen text-white flex flex-col">
  <!-- Tabs -->
  <div class="flex border-b border-gray-700">
    <button
      class="flex-1 py-2 px-4 text-center"
      [class.bg-gray-800]="activeTab === 'content'"
      [class.text-rayman-yellow]="activeTab === 'content'"
      (click)="switchTab('content')"
    >
      Content
    </button>
    <button
      class="flex-1 py-2 px-4 text-center"
      [class.bg-gray-800]="activeTab === 'configurator'"
      [class.text-rayman-yellow]="activeTab === 'configurator'"
      (click)="switchTab('configurator')"
    >
      Configurator
    </button>
  </div>

  <!-- Tab Content -->
  <div class="flex-1 flex flex-col">
    <!-- Configurator Tab -->
    <div *ngIf="activeTab === 'configurator'" class="p-6 bg-gray-800 overflow-y-auto">
      <h2 class="text-2xl font-bold mb-4 text-rayman-yellow">Variant Configurator</h2>
      <lib-variant-selector></lib-variant-selector>
    </div>

    <!-- Content Tab -->
    <div *ngIf="activeTab === 'content'" >
      <!-- Header -->
      <lib-ui-components-header
        [variant]="globalVariant"
        [align]="headerConfig.align"
        [dark]="headerConfig.dark"
        [title]="headerConfig.title"
        [subtitle]="headerConfig.subtitle"
        [navItems]="headerConfig.navItems"
        [customStyles]="headerConfig.customStyles"
      ></lib-ui-components-header>

      <!-- Navbar -->
      <div class="z-30">
        <lib-ui-components-nav-bar
          [variant]="globalVariant"
          [logoText]="navBarConfig.logoText"
          [showMobileMenu]="navBarConfig.showMobileMenu"
          [isFixed]="navBarConfig.isFixed"
          [navLinks]="navBarConfig.navLinks"
          [customStyles]="navBarConfig.customStyles"
          (linkClicked)="scrollToSection($event)"
        ></lib-ui-components-nav-bar>
      </div>

      <!-- Main Content -->
      <section class="flex-1">
        <router-outlet></router-outlet>
      </section>

      <!-- Footer -->
      <lib-ui-components-footer
        [variant]="globalVariant"
        [dark]="footerConfig.dark"
        [showParticles]="footerConfig.showParticles"
        [title]="footerConfig.title"
        [description]="footerConfig.description"
        [exploreLinks]="footerConfig.exploreLinks"
        [trendLinks]="footerConfig.trendLinks"
        [socialIcons]="footerConfig.socialIcons"
        [copyrightText]="footerConfig.copyrightText"
        [customStyles]="footerConfig.customStyles"
        (linkClicked)="onLinkClick($event)"
        (socialClicked)="onSocialClick($event)"
      ></lib-ui-components-footer>
    </div>
  </div>
</div>

<router-outlet></router-outlet>

<!-- HERO SECTION -->
<section id="hero" class="relative z-20">
  <lib-ui-hero-section
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [showCta]="heroConfig.showCta"
    [ctaLabel]="heroConfig.ctaLabel"
    [showScrollIcon]="heroConfig.showScrollIcon"
    [videoBackground]="heroConfig.videoBackground"
    [videoUrl]="heroConfig.videoUrl"
    [videoPoster]="heroConfig.videoPoster"
    [navigationCards]="heroConfig.navigationCards"
    [carouselItems]="heroConfig.carouselItems"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero-section>
</section>

<!-- STATS SECTION (New!) -->
<section id="stats" class="relative z-20">
  <lib-ui-components-stats-section
    [title]="'Nuestro Impacto'"
    [subtitle]="'Resultados tangibles para marcas ambiciosas.'"
    [variant]="getVariant('stats')"
    [stats]="agencyStats"
  ></lib-ui-components-stats-section>
</section>

<!-- SHOWCASE SECTION (New!) -->
<section id="showcase" class="relative z-20 py-16">
  <div class="container mx-auto px-6">
    <lib-ui-components-title
        [level]="'h2'"
        [text]="'Universo de Diseños'"
        [variant]="getVariant('title')"
        [align]="'center'"
        class="mb-12"
    ></lib-ui-components-title>
    <lib-ui-gaming-variants-showcase></lib-ui-gaming-variants-showcase>
  </div>
</section>

<!-- PROCESS STEPS (New!) -->
<section id="process" class="relative z-20 bg-slate-900/50 backdrop-blur-xl py-20">
  <lib-ui-steps-section
    [title]="'El Método Anto'"
    [subtitle]="'Un camino diseñado para el éxito.'"
    [steps]="agencySteps"
    [variant]="'timeline'"
  ></lib-ui-steps-section>
</section>

<!-- SERVICES SECTION -->
<section id="servicios" class="relative z-20 py-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      [level]="titleConfig.level"
      [text]="titleConfig.text"
      [variant]="getVariant('title')"
      [align]="titleConfig.align"
      class="mb-12"
    ></lib-ui-components-title>
    <lib-ui-components-card-rutas
      [items]="serviceCardsConfig.items"
      [variant]="getVariant('card')"
      [backgroundColor]="cardConfig.backgroundColor"
      [animation]="cardConfig.animation"
    ></lib-ui-components-card-rutas>
  </div>
</section>

<!-- SEARCH SECTION -->
<section id="search" class="relative z-20 py-12 bg-gradient-to-r from-blue-900 via-indigo-900 to-purple-900">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="text-center mb-8">
      <lib-ui-components-title
        [level]="'h3'"
        [text]="'Explora nuestra librería'"
        [variant]="getVariant('title')"
        [align]="'center'"
      ></lib-ui-components-title>
    </div>
    <div class="flex justify-center">
      <div class="relative w-full max-w-md">
        <input
          type="text"
          placeholder="¿Qué estás buscando?..."
          class="w-full px-6 py-4 rounded-full border-2 border-cyan-400 bg-black/60 text-white placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-cyan-400/20 transition-all duration-300"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($event)"
        />
      </div>
    </div>
  </div>
</section>

<!-- PRODUCTS SECTION -->
<section id="productos" class="relative z-20 py-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="glass-panel p-12">
      <lib-ui-components-title
        [level]="'h2'"
        [text]="'Herramientas Pro'"
        [variant]="getVariant('title')"
        [align]="'center'"
        class="mb-12"
      ></lib-ui-components-title>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <ng-container *ngFor="let product of productsConfig.items; let i = index">
          <lib-ui-components-card-animated
            [title]="product.name"
            [description]="product.description"
            [image]="product.image"
            [variant]="getVariant('product-3d')"
            [animation]="'zoom'"
          ></lib-ui-components-card-animated>
        </ng-container>
      </div>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonios" class="relative z-20 py-20 bg-black/20">
    <lib-ui-testimonials-section
      [title]="'Ecos de Éxito'"
      [subtitle]="'Lo que dicen quienes ya transformaron su presencia digital.'"
      [variant]="getVariant('title')"
      [testimonials]="testimonials"
    ></lib-ui-testimonials-section>
</section>

<!-- CONTACT & FORM -->
<section id="contacto" class="relative z-20 py-24 bg-gradient-to-b from-transparent to-black">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="text-center mb-16">
        <lib-ui-components-title
            [text]="'¿Listo para escalar?'"
            [variant]="getVariant('title')"
            [align]="'center'"
        ></lib-ui-components-title>
        <p class="text-dim mt-4">Solicita una auditoría estratégica sin compromiso.</p>
    </div>
    <lib-reservation-form
      [variant]="getVariant('form')"
    ></lib-reservation-form>
  </div>
</section>

<lib-bubble-animation [variant]="getVariant('bubble')" [config]="bubbleConfig"></lib-bubble-animation>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles'"
  [content]="selectedService?.description"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

<router-outlet></router-outlet>

<section id="hero" class="relative z-20">
  <lib-ui-hero
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [showCta]="heroConfig.showCta"
    [ctaLabel]="heroConfig.ctaLabel"
    [showScrollIcon]="heroConfig.showScrollIcon"
    [videoBackground]="heroConfig.videoBackground"
    [videoUrl]="heroConfig.videoUrl"
    [videoPoster]="heroConfig.videoPoster"
    [navigationCards]="heroConfig.navigationCards"
    [carouselItems]="heroConfig.carouselItems"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero>
</section>

<section id="search" class="relative z-20 py-6 bg-gradient-to-r from-purple-900 via-blue-900 to-indigo-900">
  <div class="container px-4">
    <div class="text-center mb-4">
      <lib-ui-title
        [level]="'h3'"
        [text]="'Buscar Servicios y Productos'"
        [variant]="getVariant('title')"
        [align]="'center'"
      ></lib-ui-title>
    </div>
    <div class="flex justify-center">
      <div class="relative w-full max-w-sm">
        <input
          type="text"
          placeholder="Buscar..."
          class="w-full px-3 py-2 rounded-full border-2 border-neon-blue bg-black/50 text-white placeholder-gray-400 focus:outline-none focus:border-cyan-400 transition-all duration-300 backdrop-blur-sm text-sm"
          [(ngModel)]="searchQuery"
          (input)="onSearchInput($event)"
        />
        <button
          class="absolute right-1 top-1/2 transform -translate-y-1/2 bg-neon-blue text-black px-3 py-1 rounded-full hover:bg-cyan-400 transition-colors duration-300 text-sm"
          (click)="performSearch()"
        >
          Buscar
        </button>
      </div>
    </div>
    <div *ngIf="searchResults.length > 0" class="mt-4 grid grid-cols-1 gap-3">
      <div
        *ngFor="let result of searchResults"
        class="bg-black/70 backdrop-blur-sm p-3 rounded-lg border border-neon-blue/50 hover:border-cyan-400 transition-all duration-300 cursor-pointer"
        (click)="selectSearchResult(result)"
      >
        <h4 class="text-neon-blue font-semibold text-sm">{{ result.name }}</h4>
        <p class="text-gray-300 text-xs">{{ result.description }}</p>
      </div>
    </div>
  </div>
</section>

<lib-bubble-animation
  [variant]="getVariant('bubble')"
  [config]="bubbleConfig"
></lib-bubble-animation>

<section id="servicios" class="relative z-20 py-12">
  <div class="container ">
    <lib-ui-title
      [level]="titleConfig.level"
      [text]="titleConfig.text"
      [variant]="getVariant('title')"
      [align]="titleConfig.align"
      class="mb-8"
    ></lib-ui-title>
    <lib-ui-card-rutas
      [items]="serviceCardsConfig.items"
      [variant]="getVariant('card')"
      [backgroundColor]="cardConfig.backgroundColor"
      [animation]="cardConfig.animation"
      [isMobile]="true"
    ></lib-ui-card-rutas>
  </div>
</section>

<section id="productos" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="backdrop-blur-xl p-8 rounded-2xl shadow-[0_10px_40px_rgba(113,255,219,0.5)] border-2 border-neon-blue">
      <lib-ui-title
        [level]="titleConfig.level"
        [text]="'Nuestros Módulos'"
        [variant]="getVariant('title')"
        [align]="titleConfig.align"
        class="mb-4"
      ></lib-ui-title>
      <lib-ui-title
        [level]="'h5'"
        [text]="'Descubre nuestra selección premium de módulos para tu web, diseñados para escalar tu negocio con eficiencia'"
        [variant]="getVariant('title')"
        [align]="titleConfig.align"
        class="mb-6"
      ></lib-ui-title>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <ng-container *ngFor="let product of productsConfig.items; let i = index; trackBy: trackByProductId">
          <lib-ui-card-animated
          *ngIf="i % 2 === 0 && i !== 2"
          [title]="product.name"
          [description]="product.description"
          [image]="product.image"
          [variant]="getVariant('product-3d')"
          [animation]="'bounce'"
          [borderColor]="'#22d3ee'"
          [backgroundColor]="'rgba(47, 79, 79, 0.9)'"
          (addToCart)="addToCart(product)"
          (viewDetails)="openServiceModal(product)"
        ></lib-ui-card-animated>
        <lib-ui-card
        *ngIf="i % 2 === 0 && i !== 0"
        [title]="product.name"
        [image]="'1029.png'"
        [description]="product.description"
        [variant]="getVariant('default')"
        [animation]="'fade'"
        [size]="'medium'"
     
      ></lib-ui-card>
        <lib-card-products
          *ngIf="i % 2 !== 0"
          [product]="product"
          [variant]="getVariant('title')"
        ></lib-card-products>
        </ng-container>
        <ng-template *ngIf="!productsConfig.items?.length">
          <p class="text-white text-center">No hay módulos disponibles en este momento.</p>
        </ng-template>
      </div>
    </div>
  </div>
</section>

<section id="testimonios" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-title
      [level]="titleConfig.level"
      [text]="'Lo que Dicen Nuestros Clientes'"
      [variant]="getVariant('title')"
      [align]="titleConfig.align"
      class="mb-8"
    ></lib-ui-title>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <lib-testimonials-card
       *ngFor="let testimonial of testimonials; trackBy: trackByTestimonialId">
        [testimonial]="testimonial"
      ></lib-testimonials-card>
    </div>
  </div>
</section>

<section id="precios" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-pricing-section
      [variant]="getVariant('pricing')"
      [priceColumns]="pricingConfig.columns"
      [priceRows]="pricingConfig.rows"
    ></lib-pricing-section>
  </div>
</section>


<section id="promociones" class="relative z-20 py-12 px-12 ml-12">
  <div class="container mx-auto px-6 max-w-7xl flex justify-center">
    <div class="max-w-5xl">
      <lib-promotions-section
        [selectedVariant]="getVariant('promotions')"
        [variant]="getVariant('promotions')"
        [premiumCardConfigs]="promotionsConfig.premiumCards"
      ></lib-promotions-section>
    </div>
  </div>
</section>

<section id="faq" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-faq-section
      [variant]="getVariant('faq')"
      [faqItems]="faqConfig.items"
    ></lib-faq-section>
  </div>
</section>

<section id="galeria" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-gallery-section
      [variant]="getVariant('gallery')"
      [images]="galleryConfig.images"
    ></lib-gallery-section>
  </div>
</section>

<section id="contacto" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-title
      [level]="titleConfig.level"
      [text]="'Solicita tu Demo Personalizada'"
      [variant]="getVariant('title')"
      [align]="titleConfig.align"
      class="mb-8"
    ></lib-ui-title>
    <lib-reservation-form
      [variant]="getVariant('form')"
    ></lib-reservation-form>
  </div>
</section>

<lib-ui-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [rounded]="'md'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles del Servicio'"
  [content]="selectedService?.description || 'Selecciona un servicio para ver más detalles.'"
  (modalOnClose)="closeModal()"
></lib-ui-modal>

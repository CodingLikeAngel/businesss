<section class="contact-section-v3" [ngClass]="['variant-' + variant()]" [ngStyle]="contactStyles()">
  <div class="container-v3">
    
    <div class="contact-grid">
      
      <!-- Lado Izquierdo: Formulario -->
      <div class="form-wrapper-v3">
        <header class="form-header">
          <lib-ui-components-title
            [text]="title()"
            [level]="'h2'"
            [variant]="variant()"
            class="mb-2"
          ></lib-ui-components-title>
          <p class="subtitle-v3">{{ subtitle() }}</p>
        </header>

        <form (ngSubmit)="onSubmit()" class="contact-form-v3">
          <div class="input-row">
            <lib-ui-components-input
              [label]="'Tu Nombre'"
              [variant]="variant()"
              [(ngModel)]="formData.name"
              name="name"
              required>
            </lib-ui-components-input>
          </div>

          <div class="input-row">
            <lib-ui-components-input
              [label]="'Tu Email'"
              [type]="'email'"
              [variant]="variant()"
              [(ngModel)]="formData.email"
              name="email"
              required>
            </lib-ui-components-input>
          </div>

          <div class="input-row">
            <lib-ui-components-input
              [label]="'Mensaje'"
              [type]="'textarea'"
              [rows]="4"
              [variant]="variant()"
              [(ngModel)]="formData.message"
              name="message"
              required>
            </lib-ui-components-input>
          </div>

          <div class="form-footer">
            <lib-ui-components-button
              [variant]="variant() === 'default' ? 'primary' : variant()"
              [size]="'lg'"
              [disabled]="isSubmitting"
              [rounded]="'md'"
              class="w-full"
              (buttonClick)="onSubmit()">
              <span class="btn-content">
                {{ isSubmitting ? 'Enviando Mensaje...' : buttonText() }}
                <span *ngIf="!isSubmitting" class="icon">🚀</span>
              </span>
            </lib-ui-components-button>
          </div>
          
          <div *ngIf="successMessage" class="success-banner">
              <span class="icon">✅</span>
              {{ successMessage }}
          </div>
        </form>
      </div>

      <!-- Lado Derecho: Info -->
      <div class="info-wrapper-v3">
         <div class="glass-info-card">
            <h3 class="info-title-v3">{{ infoTitle() }}</h3>
            
            <div class="contact-items-v3">
               <div *ngFor="let item of contactItems()" class="contact-item-v3">
                  <div class="item-icon-box">{{ item.icon }}</div>
                  <div class="item-details">
                     <span class="item-label">{{ item.title }}</span>
                     <a *ngIf="item.link" [href]="item.link" class="item-value link">{{ item.value }}</a>
                     <span *ngIf="!item.link" class="item-value">{{ item.value }}</span>
                  </div>
               </div>
            </div>

            <!-- Redes Sociales / Decoración -->
            <div class="social-decoration">
               <div class="glow-blob"></div>
            </div>
         </div>
      </div>

    </div>

  </div>
</section>

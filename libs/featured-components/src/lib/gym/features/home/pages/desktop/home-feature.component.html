<router-outlet></router-outlet>

<!-- NAVIGATION -->
<div class="relative z-30">
  <lib-ui-components-nav-bar
    [variant]="getVariant('navbar')"
    [navLinks]="navBarConfig.navLinks"
    [customStyles]="navBarConfig.customStyles"
    (linkClicked)="scrollToSection($event)"
  ></lib-ui-components-nav-bar>
</div>

<!-- HERO -->
<section id="hero" class="relative z-20">
  <lib-ui-hero-section
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [showCta]="heroConfig.showCta"
    [ctaLabel]="heroConfig.ctaLabel"
    [showScrollIcon]="heroConfig.showScrollIcon"
    [videoBackground]="heroConfig.videoBackground"
    [videoUrl]="heroConfig.videoUrl"
    [videoPoster]="heroConfig.videoPoster"
    [navigationCards]="heroConfig.navigationCards"
    [carouselItems]="heroConfig.carouselItems"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero-section>
</section>

<!-- STATS -->
<section id="stats" class="relative z-20 py-16 bg-slate-950">
  <lib-ui-components-stats-section
    [title]="'Fuerza en Cifras'"
    [subtitle]="'Tu comunidad, tu evolución, tu éxito.'"
    [variant]="'neon'"
    [stats]="gymStats"
  ></lib-ui-components-stats-section>
</section>

<!-- PROGRESS CHART -->
<section id="analytics" class="relative z-20 py-20 bg-slate-900">
  <div class="container mx-auto px-6">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
        <div>
            <lib-ui-components-title
                [text]="'Seguimiento en Tiempo Real'"
                [variant]="getVariant('title')"
                [align]="'left'"
            ></lib-ui-components-title>
            <p class="text-white/70 mt-6 text-xl leading-relaxed">
                Nuestra plataforma exclusiva te permite monitorizar cada repetición, cada julio de energía y cada gramo de progreso. La ciencia del deporte a tu favor.
            </p>
        </div>
        <div class="p-8 bg-slate-800/50 rounded-2xl border border-white/10 backdrop-blur-sm">
            <lib-ui-chart
                [title]="'Evolución de Rendimiento'"
                [variant]="'cybernetic'"
                [data]="chartData"
            ></lib-ui-chart>
        </div>
    </div>
  </div>
</section>

<!-- THE PATH (Steps) -->
<section id="steps" class="relative z-20 py-24 bg-gradient-to-r from-slate-900 to-black">
  <lib-ui-steps-section
    [title]="'Tu Camino al Éxito'"
    [subtitle]="'Un proceso probado para transformar tu vida.'"
    [steps]="gymSteps"
    [variant]="'timeline'"
  ></lib-ui-steps-section>
</section>

<!-- SERVICES / CLASSES -->
<section id="servicios" class="relative z-20 py-20 bg-slate-950/80">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Disciplinas de Élite"
      [variant]="getVariant('title')"
      align="center"
      class="mb-16"
    ></lib-ui-components-title>
    
    <lib-ui-components-card-rutas
      [items]="serviceCards"
      [variant]="getVariant('card')"
      [backgroundColor]="'rgba(20, 20, 20, 0.8)'"
      [isMobile]="false"
    ></lib-ui-components-card-rutas>
  </div>
</section>

<!-- PROMOTIONS (New!) -->
<section id="promociones" class="relative z-20 py-24 bg-slate-900">
  <div class="container mx-auto px-6 max-w-7xl">
     <lib-promotions-section 
        [variant]="'banner'" 
        [items]="premiumCardConfigs"
        [title]="'Ofertas Explosivas'"
     ></lib-promotions-section>
  </div>
</section>

<!-- PRICING -->
<section id="precios" class="relative z-20 py-20 bg-black/60">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Planes de Membresía"
      [variant]="getVariant('title')"
      align="center"
      class="mb-16"
    ></lib-ui-components-title>
    <div class="p-8 bg-slate-900/50 rounded-2xl border border-red-900/30">
        <lib-ui-pricing-table-section 
            [variant]="'minimal'" 
            [columns]="priceColumns" 
            [rows]="priceRows"
        ></lib-ui-pricing-table-section>
    </div>
  </div>
</section>

<!-- PRODUCTS -->
<section id="productos" class="relative z-20 py-24 bg-slate-900">
    <lib-products-section
        [title]="'Suplementación Pro'"
        [subtitle]="'Maximiza tus resultados con nuestra línea premium.'"
        [products]="products"
        [variant]="'glass'"
    ></lib-products-section>
</section>

<!-- FAQ (Accordion) -->
<section id="faq" class="relative z-20 py-20 bg-slate-950">
  <div class="container mx-auto px-6 max-w-4xl">
    <lib-ui-faq-section 
        [variant]="'accordion'" 
        [items]="faqItems"
    ></lib-ui-faq-section>
  </div>
</section>

<!-- GALLERY -->
<section id="galeria" class="relative z-20 py-20 bg-black">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-gallery-section 
        [variant]="'masonry'" 
        [images]="allGalleryConfigs[0].images"
    ></lib-ui-components-gallery-section>
  </div>
</section>

<!-- CONTACT -->
<section id="forms" class="relative z-20 py-24 mb-10 bg-gradient-to-t from-black to-slate-900">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="p-12 bg-slate-900 rounded-2xl border border-red-500/20 shadow-[0_0_50px_rgba(220,38,38,0.2)]">
        <lib-reservation-form [variant]="'neon'"></lib-reservation-form>
    </div>
  </div>
</section>

<!-- NEWSLETTER -->
<section class="relative z-20 py-16 bg-red-600 text-white">
    <lib-ui-newsletter-section
        [title]="'Comunidad Espartana'"
        [description]="'Consejos de nutrición, rutinas y motivación semanal.'"
        [variant]="'glass'"
    ></lib-ui-newsletter-section>
</section>

<lib-ui-components-footer
  [variant]="getVariant('footer')"
  [title]="footerConfig.title"
  [description]="footerConfig.description"
  [exploreLinks]="footerConfig.exploreLinks"
  [trendLinks]="footerConfig.trendLinks"
  [socialIcons]="footerConfig.socialIcons"
  [copyrightText]="footerConfig.copyrightText"
  [showParticles]="footerConfig.showParticles"
  [dark]="footerConfig.dark"
  [customStyles]="footerConfig.customStyles"
  (linkClicked)="scrollToSection($event)"
  (socialClicked)="onSocialClick($event)"
></lib-ui-components-footer>

<lib-bubble-animation [variant]="getVariant('bubble')" [config]="bubbleConfig"></lib-bubble-animation>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles'"
  [content]="selectedService?.description"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

<router-outlet></router-outlet>

<div class="relative z-30">
   <lib-ui-components-nav-bar
     [variant]="getVariant('navbar')"
     [logoText]="navBarConfig.logoText"
     [showMobileMenu]="navBarConfig.showMobileMenu"
     [isFixed]="navBarConfig.isFixed"
     [navLinks]="navBarConfig.navLinks"
     [customStyles]="navBarConfig.customStyles"
     (linkClicked)="scrollToSection($event)"
   ></lib-ui-components-nav-bar>
 </div>

<section id="hero" class="relative z-20">
   <lib-ui-hero-section
     [variant]="getVariant('hero')"
     [title]="heroConfig.title"
     [subtitle]="heroConfig.subtitle"
     [showCta]="heroConfig.showCta"
     [ctaLabel]="heroConfig.ctaLabel"
     [showScrollIcon]="heroConfig.showScrollIcon"
     [videoBackground]="heroConfig.videoBackground"
     [videoUrl]="heroConfig.videoUrl"
     [videoPoster]="heroConfig.videoPoster"
     [navigationCards]="heroConfig.navigationCards"
     [carouselItems]="heroConfig.carouselItems"
     [customStyles]="heroConfig.customStyles"
     (sectionSelected)="scrollToSection($event)"
   ></lib-ui-hero-section>
  </section>

<lib-bubble-animation
  [variant]="getVariant('bubble')"
  [config]="bubbleConfig"
></lib-bubble-animation>

<section id="servicios" class="relative z-20 py-12">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Nuestros Servicios"
      [variant]="getVariant('title')"
      animation="slide"
      align="center"
      class="mb-8"
    ></lib-ui-components-title>
    <div class="flex justify-center py-12">
      <lib-ui-components-card-rutas
        [items]="serviceCards"
        [variant]="getVariant('card')"
        [backgroundColor]="'rgba(255,255,255,0.1)'"
        [textColor]="'#FACC15'"
        [accentColor]="'#FF1E56'"
        [isMobile]="false"
      ></lib-ui-components-card-rutas>
    </div>
  </div>
</section>

<section id="faq" class="relative z-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="rounded-2xl">
      <lib-ui-faq-section [variant]="getVariant('faq')" [items]="faqItems"></lib-ui-faq-section>
    </div>
  </div>
</section>

<section id="precios" class="relative z-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-pricing-table-section [variant]="getVariant('pricing')" [columns]="priceColumns" [rows]="priceRows"></lib-ui-pricing-table-section>
  </div>
</section>

<section id="promociones" class="relative z-20">
  <div class="container mx-auto px-6 max-w-7xl flex justify-center">
    <div class="max-w-5xl">
      <lib-promotions-section
        [variant]="getVariant('promotions')"
        [items]="premiumCardConfigs"
      ></lib-promotions-section>
    </div>
  </div>
</section>

<section id="galeria" class="relative z-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-gallery-section [variant]="getVariant('gallery')" [images]="allGalleryConfigs[0].images"></lib-ui-components-gallery-section>
  </div>
</section>

<section id="forms" class="relative z-20">
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="p-8 rounded-2xl">
      <lib-reservation-form [variant]="getVariant('form')"></lib-reservation-form>
    </div>
  </div>
</section>

<section id="productos" class="mb-16 relative z-10">
  <div class="backdrop-blur-xl p-8 rounded-2xl shadow-[0_10px_40px_rgba(255,30,86,0.3)] overflow-hidden">
    <div class="particle-layer absolute inset-0 z-0"></div>
    <lib-ui-components-title
      level="h2"
      text="Nuestros Productos"
      [variant]="getVariant('title')"
      animation="slide"
      align="center"
      class="mb-8"
    ></lib-ui-components-title>
    <p class="text-white text-lg mb-8 text-center max-w-2xl mx-auto animate-fade-in">
      Descubre nuestra selección premium de productos para el cabello, diseñados para realzar tu estilo con calidad y sostenibilidad.
    </p>
    <div class="relative" role="region" aria-labelledby="productos-heading">
      <ng-container *ngIf="products?.length; else noProducts">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <div *ngFor="let product of products; trackBy: trackByProductId" class="product-card relative bg-[rgba(255,255,255,0.1)] rounded-xl p-6 transform hover:scale-105 hover:shadow-[0_0_20px_rgba(255,30,86,0.7)] transition-all duration-500">
            <img [src]="product.image" [alt]="product.name" class="w-full h-48 object-cover rounded-lg mb-4" loading="lazy" />
            <h3 class="text-xl font-semibold text-[#FACC15] mb-2">{{ product.name }}</h3>
            <p class="text-white mb-4">{{ product.description }}</p>
            <p class="text-[#FF1E56] font-bold">{{ product.price }}</p>
            <button
              (click)="addToCart(product)"
              class="mt-4 px-4 py-2 bg-gradient-to-r from-[#FF1E56] to-[#FACC15] text-white rounded-full hover:shadow-[0_0_15px_rgba(255,30,86,1)] transition-all duration-300"
            >
              Comprar Ahora
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #noProducts>
        <p class="text-white text-center">No hay productos disponibles en este momento.</p>
      </ng-template>
    </div>
  </div>
</section>

<lib-ui-components-footer
  [variant]="getVariant('footer')"
  [title]="footerConfig.title"
  [description]="footerConfig.description"
  [exploreLinks]="footerConfig.exploreLinks"
  [trendLinks]="footerConfig.trendLinks"
  [socialIcons]="footerConfig.socialIcons"
  [copyrightText]="footerConfig.copyrightText"
  [showParticles]="footerConfig.showParticles"
  [dark]="footerConfig.dark"
  [customStyles]="footerConfig.customStyles"
  (linkClicked)="scrollToSection($event)"
  (socialClicked)="onSocialClick($event)"
></lib-ui-components-footer>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [rounded]="'md'"
  [size]="'lg'"
  [dark]="false"
  [title]="selectedService?.serviceName || 'Detalles del Servicio'"
  [content]="selectedService?.description || 'Selecciona un servicio para ver más detalles.'"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

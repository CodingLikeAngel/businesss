<section [ngClass]="containerClasses()" [ngStyle]="pricingStyles()" role="region" aria-labelledby="pricing-section-title">
  <div class="pricing-inner">
    <header class="header-content">
      <lib-ui-components-title
        id="pricing-section-title"
        level="h2"
        [text]="title()"
        [variant]="variant()"
        align="center"
      ></lib-ui-components-title>
      <p class="pricing-section__subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
    </header>

    <div class="table-wrapper" *ngIf="rows().length > 0">
      <lib-ui-components-table
        [variant]="tableVariant()"
        [columns]="columns()"
        [rows]="rows()"
        [dark]="true"
        [size]="'lg'"
        [rounded]="'md'"
      ></lib-ui-components-table>
    </div>

    <div class="pricing-empty" *ngIf="rows().length === 0" role="status" aria-labelledby="pricing-empty-title">
      <p id="pricing-empty-title" class="pricing-empty__title">No hay planes configurados</p>
      <p class="pricing-empty__description">Añade filas a la tabla de precios para mostrarlos aquí.</p>
    </div>
  </div>
</section>

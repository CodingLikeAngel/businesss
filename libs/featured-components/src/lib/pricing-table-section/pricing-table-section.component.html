<section [ngClass]="containerClasses()" [ngStyle]="pricingStyles()" aria-labelledby="pricing-section-title">
  <div class="pricing-inner">
    <header class="header-content">
      <lib-ui-components-title
        id="pricing-section-title"
        level="h2"
        [text]="title()"
        [variant]="variant()"
        align="center"
      ></lib-ui-components-title>
      <p class="pricing-section__subtitle" *ngIf="subtitle()">{{ subtitle() }}</p>
    </header>

    <div class="table-wrapper">
      <lib-ui-components-table
        [variant]="tableVariant()"
        [columns]="columns()"
        [rows]="rows()"
        [dark]="true"
        [size]="'lg'"
        [rounded]="'md'"
      ></lib-ui-components-table>
    </div>
  </div>
</section>

<router-outlet></router-outlet>

<!-- NAVIGATION -->
<div class="relative z-30">
  <lib-ui-components-nav-bar
    [variant]="getVariant('navbar')"
    [navLinks]="navBarConfig.navLinks"
    [customStyles]="navBarConfig.customStyles"
    (linkClicked)="scrollToSection($event)"
  ></lib-ui-components-nav-bar>
</div>

<!-- HERO SECTION -->
<section id="hero" class="relative z-20">
  <lib-ui-hero-section
    [variant]="getVariant('hero')"
    [title]="heroConfig.title"
    [subtitle]="heroConfig.subtitle"
    [showCta]="heroConfig.showCta"
    [ctaLabel]="heroConfig.ctaLabel"
    [showScrollIcon]="heroConfig.showScrollIcon"
    [videoBackground]="heroConfig.videoBackground"
    [videoUrl]="heroConfig.videoUrl"
    [videoPoster]="heroConfig.videoPoster"
    [navigationCards]="heroConfig.navigationCards"
    [carouselItems]="heroConfig.carouselItems"
    [customStyles]="heroConfig.customStyles"
    (sectionSelected)="scrollToSection($event)"
  ></lib-ui-hero-section>
</section>

<!-- STATS SECTION -->
<section id="stats" class="relative z-20 py-16 bg-blue-50/50">
  <lib-ui-components-stats-section
    [title]="'Excelencia Médica'"
    [subtitle]="'Resultados que respaldan nuestra trayectoria.'"
    [variant]="'glass'"
    [stats]="clinicStats"
  ></lib-ui-components-stats-section>
</section>

<!-- FEATURES (WHY US) -->
<section id="features" class="relative z-20 py-24 bg-white">
  <div class="container mx-auto px-6">
    <lib-ui-features-section
      [title]="'Cuidado Integral'"
      [subtitle]="'Tecnología y humanidad al servicio de tu salud.'"
      [features]="clinicFeatures"
      [variant]="'cards'"
    ></lib-ui-features-section>
  </div>
</section>

<!-- SERVICES (Medical Departments) -->
<section id="servicios" class="relative z-20 py-20 bg-slate-50">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Especialidades Médicas"
      [variant]="getVariant('title')"
      align="center"
      class="mb-16"
    ></lib-ui-components-title>
    
    <lib-ui-components-card-rutas
      [items]="serviceCards"
      [variant]="getVariant('card')"
      [backgroundColor]="'rgba(255, 255, 255, 1)'"
      [isMobile]="false"
    ></lib-ui-components-card-rutas>
  </div>
</section>

<!-- PROMOTIONS (Health Packages) -->
<section id="promociones" class="relative z-20 py-24 bg-white">
  <div class="container mx-auto px-6 max-w-7xl">
     <lib-promotions-section 
        [variant]="'banner'" 
        [items]="premiumCardConfigs"
        [title]="'Planes de Salud'"
        [description]="'Chequeos preventivos y tratamientos a tu medida.'"
     ></lib-promotions-section>
  </div>
</section>

<!-- PRICING / CONSULTATION FEES -->
<section id="precios" class="relative z-20 py-20 bg-blue-50/30">
  <div class="container mx-auto px-6 max-w-5xl">
    <lib-ui-components-title
      level="h2"
      text="Tarifas de Consulta"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <div class="glass-panel p-8 bg-white border border-blue-100 shadow-sm rounded-2xl">
        <lib-ui-pricing-table-section 
            [variant]="'minimal'" 
            [columns]="priceColumns" 
            [rows]="priceRows"
        ></lib-ui-pricing-table-section>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section id="testimonios" class="relative z-20 py-24 bg-white">
    <lib-ui-testimonials-section
      [title]="'Voces de Recuperación'"
      [subtitle]="'Historias reales de pacientes satisfechos.'"
      [variant]="'default'"
      [testimonials]="clinicTestimonials"
    ></lib-ui-testimonials-section>
</section>

<!-- GALLERY -->
<section id="galeria" class="relative z-20 py-20 bg-slate-50">
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-components-title
      level="h2"
      text="Nuestras Instalaciones"
      [variant]="getVariant('title')"
      align="center"
      class="mb-12"
    ></lib-ui-components-title>
    <lib-ui-components-gallery-section 
        [variant]="'carousel'" 
        [images]="allGalleryConfigs[0].images"
    ></lib-ui-components-gallery-section>
  </div>
</section>

<!-- FAQ -->
<section id="faq" class="relative z-20 py-20 bg-white">
  <div class="container mx-auto px-6 max-w-4xl">
    <lib-ui-faq-section 
        [variant]="'accordion'" 
        [items]="faqItems"
    ></lib-ui-faq-section>
  </div>
</section>

<!-- APPOINTMENT FORM -->
<section id="cita" class="relative z-20 py-24 bg-gradient-to-br from-blue-500 to-cyan-500">
  <div class="container mx-auto px-6 max-w-4xl">
    <div class="glass-panel p-12 bg-white/90 backdrop-blur-lg rounded-2xl shadow-xl">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-bold text-slate-800 mb-4">Agenda tu Cita Médica</h2>
            <p class="text-slate-600">Selecciona tu especialista y horario preferido.</p>
        </div>
        <lib-reservation-form [variant]="'default'"></lib-reservation-form>
    </div>
  </div>
</section>

<!-- FOOTER -->
<lib-ui-components-footer
  [variant]="getVariant('footer')"
  [title]="footerConfig.title"
  [description]="footerConfig.description"
  [exploreLinks]="footerConfig.exploreLinks"
  [trendLinks]="footerConfig.trendLinks"
  [socialIcons]="footerConfig.socialIcons"
  [copyrightText]="footerConfig.copyrightText"
  [showParticles]="footerConfig.showParticles"
  [dark]="footerConfig.dark"
  [customStyles]="footerConfig.customStyles"
  (linkClicked)="scrollToSection($event)"
  (socialClicked)="onSocialClick($event)"
></lib-ui-components-footer>

<lib-bubble-animation [variant]="getVariant('bubble')" [config]="bubbleConfig"></lib-bubble-animation>

<lib-ui-components-modal
  [isOpen]="modalOpen"
  [variant]="'glass'"
  [size]="'lg'"
  [title]="selectedService?.serviceName || 'Detalles'"
  [content]="selectedService?.description"
  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

<!-- DESKTOP TITLE -->
<section *ngIf="!isMobile" #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative py-12"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleVisualEventStandalone($event, section.id)">
  <lib-editor-section-chrome
    sectionLabel="Título"
    sectionIcon="📝"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 max-w-7xl relative min-h-[50px]">
    <lib-ui-components-title #titleElement
      [level]="section.content['level'] || 'h2'"
      [text]="section.content['text'] || 'Title Text'"
      [variant]="section.content['variant'] || getVariant(section.id)"
      [align]="section.content['align'] || 'center'"
      [animation]="section.content['animation'] || 'none'"
      [customStyles]="section.content['titleStyles'] || section.customStyles"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_title'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_title', section.content, 'title'))"
      [enhancedVisualEditable]="getTitleConfig()"
      elementId="{{section.id + '_title'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleVisualEventStandalone($event, section.id + '_title')"
      [style.position]="section.content['titleStyles']?.['position'] || 'relative'"
      [style.width]="section.content['titleStyles']?.['width'] || '100%'"
      [style.min-height]="section.content['titleStyles']?.['minHeight'] || 'auto'"
      [style.left]="section.content['titleStyles']?.['left']"
      [style.top]="section.content['titleStyles']?.['top']"
    >
    </lib-ui-components-title>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-title-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-title-isolated-mode>
</section>

<!-- MOBILE TITLE -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-8 p-4 relative"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleVisualEventStandalone($event, section.id)">

  <lib-ui-components-title #titleElement
    [level]="section.content['level'] || 'h3'"
    [text]="section.content['text'] || 'Title Text'"
    [variant]="section.content['variant'] || getVariant(section.id)"
    [align]="section.content['align'] || 'center'"
    class="editor-element"
    [class.is-selected]="selectedElementId === section.id + '_title'"
    (click)="selectElement($event, { id: section.id + '_title', content: section.content, type: 'title' })"
    [enhancedVisualEditable]="getTitleConfig()"
    elementId="{{section.id + '_title'}}"
    sectionId="{{section.id}}"
    (visualEvents)="handleVisualEventStandalone($event, section.id + '_title')">
  </lib-ui-components-title>
</div>

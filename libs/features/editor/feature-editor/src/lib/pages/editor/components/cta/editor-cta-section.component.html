<!-- Standardized CTA Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-500"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #ctaElement class="editor-element p-4"
       [class.is-selected]="selectedElementId === section.id + '_cta'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_cta', section.content, 'cta'))"
       [enhancedVisualEditable]="getCtaConfig()"
       elementId="{{section.id + '_cta'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleCtaEvent($event)">
    
    <lib-ui-cta-section
      [title]="section.content['title'] || '¿Listo para impulsar tu negocio?'"
      [description]="section.content['description'] || 'Únete a nosotros y descubre el futuro del éxito profesional.'"
      [ctaLabel]="section.content['ctaLabel'] || 'Ver Ofertas'"
      [variant]="$any(getVariant(section.id))"
    ></lib-ui-cta-section>

  </div>
</div>

<lib-editor-cta-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="closeIsolatedMode()"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-cta-isolated-mode>

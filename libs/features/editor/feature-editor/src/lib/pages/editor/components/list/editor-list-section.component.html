<div class="editor-section cursor-pointer transition-all duration-500 group relative py-12"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="createElementConfig('section')"
  elementId="{{section.id}}"
  (visualEvents)="handleVisualEvent($event, section.id)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-50 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Interface / Smart List</span>
      <div class="h-4 w-[1px] bg-slate-200 mx-2"></div>
      <button (click)="openIsolatedMode($event)" class="bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full hover:bg-indigo-700 transition-colors uppercase tracking-widest shadow-lg shadow-indigo-200 flex items-center gap-2">
        <span>🎯</span> EDITOR AVANZADO PRO
      </button>
    </div>
  </div>

    <div class="container mx-auto px-6 max-w-2xl editor-element"
       [class.is-selected]="selectedElementId === section.id + '_list'"
       (click)="selectElement($event, { id: section.id + '_list', sectionId: section.id, content: section.content, type: 'list', _original: section.content })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="createElementConfig('element')"
       elementId="{{section.id + '_list'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleVisualEvent($event, section.id + '_list')">
       <lib-ui-list
         [items]="section.content['items'] || ['Item 1', 'Item 2', 'Item 3']"
         [variant]="section.content['variant'] || getVariant(section.id)"
         [rounded]="section.content['rounded'] || 'md'"
         [size]="section.content['size'] || 'md'"
         [customStyles]="section.styles || {}"
       ></lib-ui-list>
    </div>

  <!-- Isolated Mode Component -->
  <lib-editor-list-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-list-isolated-mode>
</div>

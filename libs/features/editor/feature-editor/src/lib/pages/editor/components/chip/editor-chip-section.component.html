<!-- DESKTOP CHIP -->
<section *ngIf="!isMobile" #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative py-8"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="Chip"
    sectionIcon="🏷️"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 flex justify-center gap-4">
    <lib-ui-components-chip #chipElement
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_chip'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_chip', section.content, 'chip'))"
      [enhancedVisualEditable]="getChipConfig()"
      elementId="{{section.id + '_chip'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleChipEvent($event)"
      (dblclick)="openIsolatedMode($event)">
      {{ section.content['label'] || 'Chip Label' }}
    </lib-ui-components-chip>
  </div>
</section>

<!-- MOBILE CHIP -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-6 p-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <lib-ui-components-chip #chipElement
    [variant]="$any(section.content['variant'] || getVariant(section.id))"
    [customStyles]="section.styles || {}"
    [applyDynamicStyles]="section.styles || {}"
    class="editor-element"
    [class.is-selected]="selectedElementId === section.id + '_chip'"
    (click)="selectElement($event, { id: section.id + '_chip', content: section.content, type: 'chip' })"
    [enhancedVisualEditable]="getChipConfig()"
    elementId="{{section.id + '_chip'}}"
    sectionId="{{section.id}}"
    (visualEvents)="handleChipEvent($event)"
    (dblclick)="openIsolatedMode($event)">
    {{ section.content['label'] || 'Chip Label' }}
  </lib-ui-components-chip>
</div>

<lib-editor-chip-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="onIsolatedModeClosed()"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-chip-isolated-mode>

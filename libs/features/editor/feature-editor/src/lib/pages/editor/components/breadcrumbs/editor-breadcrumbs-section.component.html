<!-- DESKTOP BREADCRUMBS -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer py-8"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div class="container mx-auto px-6 max-w-4xl">
    <lib-ui-components-breadcrumbs #breadcrumbsElement
      [variant]="section.content['variant'] || getVariant(section.id)"
      [items]="section.content['items'] || [{ label: 'Home', url: '/' }, { label: 'Section', url: '/section' }, { label: 'Current', url: '' }]"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_breadcrumbs'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_breadcrumbs', section.content, 'breadcrumbs'))"
      [enhancedVisualEditable]="getBreadcrumbsConfig()"
      elementId="{{section.id + '_breadcrumbs'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleBreadcrumbsEvent($event)">
    </lib-ui-components-breadcrumbs>
  </div>
</div>

<!-- MOBILE BREADCRUMBS -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-6 p-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <lib-ui-components-breadcrumbs #breadcrumbsElement
    [variant]="section.content['variant'] || getVariant(section.id)"
    [items]="section.content['items'] || [{ label: 'Home', url: '/' }, { label: 'Section', url: '/section' }, { label: 'Current', url: '' }]"
    [customStyles]="section.styles || {}"
    [applyDynamicStyles]="section.styles || {}"
    class="editor-element"
    [class.is-selected]="selectedElementId === section.id + '_breadcrumbs'"
    (click)="selectElement($event, { id: section.id + '_breadcrumbs', content: section.content, type: 'breadcrumbs' })"
    [enhancedVisualEditable]="getBreadcrumbsConfig()"
    elementId="{{section.id + '_breadcrumbs'}}"
    sectionId="{{section.id}}"
    (visualEvents)="handleBreadcrumbsEvent($event)">
  </lib-ui-components-breadcrumbs>
</div>

<!-- Premium Products Editor Section -->
<section #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer py-12 transition-all duration-700 relative"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="Productos"
    sectionIcon="🛒"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 max-w-7xl">
    <div #productsElement class="editor-element"
         [class.is-selected]="selectedElementId === section.id + '_products_wrapper'"
         (click)="selectElement($event, getMergedElement(section.id, section.id + '_products_wrapper', section.content, 'products'))"
         [enhancedVisualEditable]="getProductsWrapperConfig()"
         elementId="{{section.id + '_products_wrapper'}}"
         sectionId="{{section.id}}"
         (visualEvents)="handleProductsWrapperEvent($event)">
      <lib-products-section
        [title]="section.content['title'] || 'Catálogo Elite'"
        [subtitle]="section.content['subtitle'] || 'Calidad garantizada en cada producto'"
        [variant]="$any(getVariant(section.id))"
        [products]="section.content['items'] || []"
      ></lib-products-section>
    </div>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-products-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-products-isolated-mode>
</section>

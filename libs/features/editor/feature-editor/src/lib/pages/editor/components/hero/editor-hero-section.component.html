<ng-container [ngSwitch]="section.type">
  
  <!-- HERO MINIMAL -->
  <lib-ui-hero-minimal *ngSwitchCase="'hero-minimal'"
      [title]="section.content['title'] || 'Less is More'"
      [subtitle]="section.content['subtitle'] || 'Minimalist design focuses on the essential.'"
      [badge]="section.content['badge'] || 'Introducing'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [ctaLabel]="section.content['ctaLabel'] || 'Read More'"
      [secondaryCtaLabel]="section.content['secondaryCtaLabel']"
      [showCta]="section.content['showCta'] !== false"
      [customStyles]="section.styles || {}"
      (click)="selectSection($event, section)"
      class="editor-section cursor-pointer block"
      [class.is-selected]="selectedSectionId === section.id">
  </lib-ui-hero-minimal>

  <!-- HERO SPLIT -->
  <lib-ui-hero-split *ngSwitchCase="'hero-split'"
      [title]="section.content['title'] || 'Hero Split'"
      [subtitle]="section.content['subtitle'] || 'Perfect balance between visuals and content.'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [ctaLabel]="section.content['ctaLabel'] || 'Get Started'"
      [secondaryCtaLabel]="section.content['secondaryCtaLabel']"
      [showCta]="section.content['showCta'] !== false"
      [image]="section.content['image']"
      [icon]="section.content['icon'] || '🚀'"
      [customStyles]="section.styles || {}"
      (click)="selectSection($event, section)"
      class="editor-section cursor-pointer block"
      [class.is-selected]="selectedSectionId === section.id">
  </lib-ui-hero-split>

  <!-- STANDARD HERO (Default) -->
  <section *ngSwitchDefault #sectionElement [id]="section.id"
    [ngClass]="getHeroClasses()"
    [style]="getHeroStyles()"
    class="editor-section overflow-hidden cursor-pointer min-h-[85vh] flex flex-col items-center justify-center p-8"
    [class.is-selected]="selectedSectionId === section.id"
    (click)="selectSection($event, section)"
    [enhancedVisualEditable]="getSectionConfig()"
    sectionId="{{section.id}}"
    (visualEvents)="handleSectionEvent($event)">

    <div class="background-overlay" [ngClass]="getOverlayClass()"></div>
    
    <div class="hero-content max-w-5xl z-10 text-center">
      <div class="editor-element mb-6"
           [class.is-selected]="selectedElementId === section.id + '_title'"
           (click)="selectElement($event, { id: section.id + '_title', sectionId: section.id, content: section.content, type: 'title' })"
           [enhancedVisualEditable]="getTitleConfig()"
           elementId="{{section.id + '_title'}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleTitleEvent($event)">
        <lib-ui-components-title
          [level]="'h1'"
          [text]="section.content['title'] || 'Título Impresionante'"
          [variant]="$any(getVariant(section.id))"
          align="center"
        ></lib-ui-components-title>
      </div>

      <div class="editor-element mb-10 opacity-90"
           [class.is-selected]="selectedElementId === section.id + '_subtitle'"
           (click)="selectElement($event, { id: section.id + '_subtitle', sectionId: section.id, content: section.content, type: 'subtitle' })"
           [enhancedVisualEditable]="getSubtitleConfig()"
           elementId="{{section.id + '_subtitle'}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleSubtitleEvent($event)">
        <p class="text-2xl md:text-3xl leading-relaxed">{{ section.content['subtitle'] || 'Tu éxito comienza con una presencia digital world-class.' }}</p>
      </div>

      <div *ngIf="section.content['showCta'] !== false"
           class="editor-element animate-bounce-subtle"
           [class.is-selected]="selectedElementId === section.id + '_cta'"
           (click)="selectElement($event, { id: section.id + '_cta', sectionId: section.id, content: section.content, type: 'cta' })"
           [enhancedVisualEditable]="getCtaConfig()"
           elementId="{{section.id + '_cta'}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleCtaEvent($event)">
        <button class="cta-button font-bold text-lg px-10 py-4 rounded-full transition-all">
          {{ section.content['ctaLabel'] || 'Empezar ahora' }}
        </button>
      </div>
    </div>

    <!-- Items Grid (Directly editable) -->
    <div class="relative z-20 mt-20 w-full max-w-7xl px-4" *ngIf="section.content['items']?.length">
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-8">
         <div *ngFor="let card of section.content['items']; let i = index"
              class="editor-element"
              [class.is-selected]="selectedElementId === section.id + '_card_' + i"
              (click)="selectElement($event, { id: section.id + '_card_' + i, sectionId: section.id, type: 'card', content: card, index: i, isItem: true })"
              [enhancedVisualEditable]="getCardConfig()"
              elementId="{{section.id + '_card_' + i}}"
              sectionId="{{section.id}}"
              (visualEvents)="handleVisualEvent($event, section.id + '_card_' + i)">
           <lib-ui-components-card-animated
             [icon]="card.icon"
             [title]="card.title"
             [description]="card.description"
             [variant]="$any(card.variant || getVariant(section.id))"
           ></lib-ui-components-card-animated>
         </div>
      </div>
    </div>
  </section>
</ng-container>
<lib-editor-hero-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="closeIsolatedMode()"
  (applied)="applyIsolatedChanges($event)">
</lib-editor-hero-isolated-mode>

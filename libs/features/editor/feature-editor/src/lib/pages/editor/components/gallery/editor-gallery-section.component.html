<!-- DESKTOP GALLERY -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer py-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #galleryElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_gallery_wrapper'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_gallery_wrapper', section.content, 'gallery'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getGalleryWrapperConfig()"
       elementId="{{section.id + '_gallery_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleGalleryWrapperEvent($event)">
    <lib-ui-components-gallery-section
      [title]="section.content['title'] || 'Galería de Proyectos'"
      [subtitle]="section.content['subtitle'] || 'Nuestro trabajo reciente'"
      [images]="section.content['items'] || galleryConfig.images"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-gallery-section>
  </div>
</div>

<!-- MOBILE GALLERY -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-2 p-2"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #galleryElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_gallery_wrapper'"
       (click)="selectElement($event, { id: section.id + '_gallery_wrapper', content: section.content, type: 'gallery' })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getGalleryWrapperConfig()"
       elementId="{{section.id + '_gallery_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleGalleryWrapperEvent($event)">
    <lib-ui-components-gallery-section
      [title]="section.content['title'] || 'Galería de Proyectos'"
      [subtitle]="section.content['subtitle'] || 'Nuestro trabajo reciente'"
      [images]="section.content['items'] || galleryConfig.images"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-gallery-section>
  </div>
</div>

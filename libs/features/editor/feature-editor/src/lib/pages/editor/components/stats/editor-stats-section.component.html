<!-- DESKTOP STATS -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group relative py-12"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-50 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Business / Growth Metrics</span>
      <div class="h-4 w-[1px] bg-slate-200 mx-2"></div>
      <button (click)="openIsolatedMode($event)" class="bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full hover:bg-indigo-700 transition-colors uppercase tracking-widest shadow-lg shadow-indigo-200 flex items-center gap-2">
        <span>🎯</span> EDITOR AVANZADO PRO
      </button>
    </div>
  </div>

  <div #statsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_stats_wrapper'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_stats_wrapper', section.content, 'stats'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getStatsWrapperConfig()"
       elementId="{{section.id + '_stats_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleStatsWrapperEvent($event)">
    <lib-ui-components-stats-section
      [title]="section.content['title'] || 'Nuestras Métricas'"
      [subtitle]="section.content['subtitle'] || 'Indicadores clave'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [stats]="section.content['items'] || statsConfig.items"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-stats-section>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-stats-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-stats-isolated-mode>
</div>

<!-- MOBILE STATS -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-2 p-2 group relative"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #statsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_stats_wrapper'"
       (click)="selectElement($event, { id: section.id + '_stats_wrapper', content: section.content, type: 'stats' })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getStatsWrapperConfig()"
       elementId="{{section.id + '_stats_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleStatsWrapperEvent($event)">
    <lib-ui-components-stats-section
      [title]="section.content['title'] || 'Nuestras Métricas'"
      [subtitle]="section.content['subtitle'] || 'Indicadores clave'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [stats]="section.content['items'] || statsConfig.items"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-stats-section>
  </div>
</div>

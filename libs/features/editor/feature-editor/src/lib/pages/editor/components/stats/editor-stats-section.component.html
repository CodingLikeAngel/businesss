<!-- DESKTOP STATS -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer py-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #statsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_stats_wrapper'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_stats_wrapper', section.content, 'stats'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getStatsWrapperConfig()"
       elementId="{{section.id + '_stats_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleStatsWrapperEvent($event)">
    <lib-ui-components-stats-section
      [title]="section.content['title'] || 'Nuestras Métricas'"
      [subtitle]="section.content['subtitle'] || 'Indicadores clave'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [stats]="section.content['items'] || statsConfig.items"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-stats-section>
  </div>
</div>

<!-- MOBILE STATS -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-2 p-2"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #statsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_stats_wrapper'"
       (click)="selectElement($event, { id: section.id + '_stats_wrapper', content: section.content, type: 'stats' })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getStatsWrapperConfig()"
       elementId="{{section.id + '_stats_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleStatsWrapperEvent($event)">
    <lib-ui-components-stats-section
      [title]="section.content['title'] || 'Nuestras Métricas'"
      [subtitle]="section.content['subtitle'] || 'Indicadores clave'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [stats]="section.content['items'] || statsConfig.items"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-components-stats-section>
  </div>
</div>

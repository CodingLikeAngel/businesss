<!-- DESKTOP PROMOTIONS -->
<section *ngIf="!isMobile" [id]="section.id"
  class="relative z-20 py-20 cursor-pointer editor-section"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [visualEditable]="true"
  visualType="section"
  (visualResized)="onSectionResized($event)">
  
  <div class="container mx-auto px-6 max-w-7xl">
    <div class="text-center mb-16">
      <h2 class="text-5xl font-extrabold mb-6 editor-element inline-block"
          [class.is-selected]="selectedElementId === section.id + '_title'"
          (click)="selectElement($event, { id: section.id + '_title', sectionId: section.id, content: section.content, type: 'title', _original: section.content })"
          [applyDynamicStyles]="section.content['titleStyles']"
          [visualEditable]="true"
          visualType="element"
          (visualMoved)="onElementMoved($event, section.id + '_title')"
          (visualResized)="onElementResized($event, section.id + '_title')">
        {{ section.content['title'] || promotionsConfig.title || 'Ofertas Especiales' }}
      </h2>
      <div class="editor-element"
           [class.is-selected]="selectedElementId === section.id + '_subtitle'"
           (click)="selectElement($event, { id: section.id + '_subtitle', sectionId: section.id, content: section.content, type: 'subtitle', _original: section.content })"
           [applyDynamicStyles]="section.content['subtitleStyles']"
           [visualEditable]="true"
           visualType="element"
           (visualMoved)="onElementMoved($event, section.id + '_subtitle')"
           (visualResized)="onElementResized($event, section.id + '_subtitle')">
        <p class="text-xl text-white/60 max-w-2xl mx-auto">
          {{ section.content['subtitle'] || promotionsConfig.description || 'Descubre nuestras promociones exclusivas y ahorra.' }}
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
      <div *ngFor="let promo of promotionsConfig.premiumCards; let i = index" 
           class="editor-element"
           [class.is-selected]="uiStateService.selectedElement?._original === promo"
           (click)="selectElement($event, getMergedElement(section.id, section.id + '_promo_' + i, promo, 'promo'))"
           [applyDynamicStyles]="promo.styles || {}"
           [visualEditable]="true"
           visualType="element"
           (visualMoved)="onElementMoved($event, section.id + '_promo_' + i)"
           (visualResized)="onElementResized($event, section.id + '_promo_' + i)">
        <lib-ui-components-card-premium
          [variant]="$any(promo.variant || getVariant(section.id))"
          [config]="promo"
          [applyDynamicStyles]="promo.styles || {}"
        ></lib-ui-components-card-premium>
      </div>
    </div>
  </div>
</section>

<!-- MOBILE PROMOTIONS (Optional or Placeholder if missing in original) -->
<div *ngIf="isMobile" class="p-4 text-center text-white/50 border border-dashed border-white/20 rounded-xl m-4">
  La sección de Promociones se edita mejor en escritorio.
</div>

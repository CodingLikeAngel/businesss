<!-- DESKTOP PROMOTIONS -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer py-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #promotionsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_promotions_wrapper'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_promotions_wrapper', section.content, 'promotions'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getPromotionsWrapperConfig()"
       elementId="{{section.id + '_promotions_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handlePromotionsWrapperEvent($event)">
    <lib-promotions-section
      [title]="section.content['title'] || 'Ofertas Especiales'"
      [description]="section.content['description'] || 'Ahorra en tus tratamientos favoritos'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [items]="section.content['items'] || promotionsConfig.premiumCards"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-promotions-section>
  </div>
</div>

<!-- MOBILE PROMOTIONS -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-2 p-2"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #promotionsElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_promotions_wrapper'"
       (click)="selectElement($event, { id: section.id + '_promotions_wrapper', content: section.content, type: 'promotions' })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getPromotionsWrapperConfig()"
       elementId="{{section.id + '_promotions_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handlePromotionsWrapperEvent($event)">
    <lib-promotions-section
      [title]="section.content['title'] || 'Ofertas Especiales'"
      [description]="section.content['description'] || 'Ahorra en tus tratamientos favoritos'"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [items]="section.content['items'] || promotionsConfig.premiumCards"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-promotions-section>
  </div>
</div>

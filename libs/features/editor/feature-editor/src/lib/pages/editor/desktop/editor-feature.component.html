<div class="sections-container min-h-screen relative pb-32">
  <!-- Floating Undo/Redo Toolbar -->

  <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[9999] flex items-center gap-4" style="pointer-events: auto;">
    <lib-undo-redo-toolbar></lib-undo-redo-toolbar>

    <!-- Mode Switcher -->
    <div class="bg-gray-900/90 backdrop-blur-md rounded-full px-2 py-1 flex items-center gap-1 border border-white/10 shadow-xl">
       <button (click)="setMode('all')" [ngClass]="{'bg-white/20 text-indigo-400': currentMode === 'all'}" class="p-2 hover:bg-white/10 rounded-full transition-colors text-white" title="Modo Completo (Mover y Redimensionar)">
         ✨
       </button>
       <div class="w-px h-4 bg-white/20 mx-1"></div>
       <button (click)="setMode('move')" [ngClass]="{'bg-white/20 text-indigo-400': currentMode === 'move'}" class="p-2 hover:bg-white/10 rounded-full transition-colors text-white" title="Modo Posición (Solo Mover)">
         📍
       </button>
       <button (click)="setMode('resize')" [ngClass]="{'bg-white/20 text-indigo-400': currentMode === 'resize'}" class="p-2 hover:bg-white/10 rounded-full transition-colors text-white" title="Modo Redimensionar (Solo Tamaño)">
         📐
       </button>
    </div>
  </div>

  <div *ngIf="loading$ | async" class="flex items-center justify-center p-20">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"
    ></div>
  </div>

  <div
    *ngIf="(sections$ | async)?.length === 0 && !(loading$ | async)"
    class="flex flex-col items-center justify-center p-20 text-white/50"
  >
    <div class="text-6xl mb-4">🏗️</div>
    <h2 class="text-2xl font-bold">Página vacía</h2>
    <p>
      Añade secciones desde la pestaña "Estructura Página" en el panel
      izquierdo.
    </p>
  </div>

        (elementResized)="
          onElementResized($event.bounds, $event.elementId, section)

        (sectionResized)="onSectionResized($event.section, $event.bounds)"

        (elementResized)="

        (elementResized)="

      <lib-editor-generic-section
        *ngSwitchCase="'generic'"

        [componentVariants]="componentVariants"
        [globalVariant]="globalVariant"

        "
        (elementResized)="

      <div
        *ngSwitchDefault
        class="editor-section cursor-pointer p-10 border border-dashed border-white/20 rounded-xl m-4 bg-white/5"
        [class.is-selected]="uiStateService.selectedSection?.id === section.id"
        (click)="selectSection($event, section)"
      >
        <div class="text-center text-white/50">
          <div class="text-4xl mb-4">🧩</div>
          <h3 class="text-xl font-bold mb-2">{{ section.label }}</h3>
          <p class="text-sm opacity-70">Tipo: {{ section.type }}</p>
          <p class="mt-4 text-xs">

    </ng-container>
  </ng-container>
</div>

<lib-ui-components-modal
  [isOpen]="modalState.isOpen"
  [variant]="'glass'"
  [rounded]="'md'"
  [size]="'lg'"
  [title]="getModalTitle()"
  [content]="
    modalState.selectedItem?.description ||

  (modalOnClose)="closeModal()"
></lib-ui-components-modal>

<div class="sections-container min-h-screen relative pb-32">
  <!-- Floating Undo/Redo Toolbar -->
  <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50">
    <lib-undo-redo-toolbar></lib-undo-redo-toolbar>
  </div>

  <div *ngIf="loading$ | async" class="flex items-center justify-center p-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"></div>
  </div>

  <div *ngIf="(sections$ | async)?.length === 0 && !(loading$ | async)" class="flex flex-col items-center justify-center p-20 text-white/50">
    <div class="text-6xl mb-4">🏗️</div>
    <h2 class="text-2xl font-bold">Página vacía</h2>
    <p>Añade secciones desde la pestaña "Estructura Página" en el panel izquierdo.</p>
  </div>

  <ng-container *ngFor="let section of sections$ | async; trackBy: trackBySectionId">
    <ng-container [ngSwitch]="section.type" *ngIf="section.visible">
      
      <!-- HERO -->
      <lib-editor-hero-section *ngSwitchCase="'hero'"
        [section]="section"
        [heroConfig]="heroConfig"
        [componentVariants]="componentVariants"
        [globalVariant]="globalVariant"
        (elementMoved)="onElementMoved($event.bounds, $event.elementId, section)"
        (elementResized)="onElementResized($event.bounds, $event.elementId, section)"
        (sectionResized)="onSectionResized($event.section, $event.bounds)">
      </lib-editor-hero-section>

      <!-- FEATURES -->
      <lib-editor-features-section *ngSwitchCase="'features'"
        [section]="section"
        [featuresConfig]="featuresConfig"

      </lib-editor-features-section>

      </lib-editor-bubble-section>

      <!-- SERVICES -->

        [serviceCardsConfig]="serviceCardsConfig"
        [titleConfig]="titleConfig"
        [componentVariants]="componentVariants"
        [globalVariant]="globalVariant"
        (elementMoved)="onElementMoved($event.bounds, $event.elementId, section)"

      <div *ngSwitchDefault class="editor-section cursor-pointer p-10 border border-dashed border-white/20 rounded-xl m-4 bg-white/5"
           [class.is-selected]="uiStateService.selectedSection?.id === section.id"
           (click)="selectSection($event, section)">
        <div class="text-center text-white/50">
          <div class="text-4xl mb-4">🧩</div>
          <h3 class="text-xl font-bold mb-2">{{ section.label }}</h3>
          <p class="text-sm opacity-70">Tipo: {{ section.type }}</p>
          <p class="mt-4 text-xs">Este componente aún no tiene una vista previa específica en el editor, pero se ha añadido a la estructura.</p>
        </div>
      </div>

  </ng-container>
</div>

<lib-ui-components-modal
   [isOpen]="modalState.isOpen"
   [variant]="'glass'"
   [rounded]="'md'"
   [size]="'lg'"
   [title]="getModalTitle()"
   [content]="modalState.selectedItem?.description || 'Selecciona un item para ver más detalles.'"
   (modalOnClose)="closeModal()"
 ></lib-ui-components-modal>

<!-- Standardized Shape Editor Section -->
<section #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative min-h-[400px] overflow-hidden"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="Shape"
    sectionIcon="🔷"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 max-w-7xl relative py-20 h-full min-h-[400px]">
    <lib-ui-shape #shapeElement
      [type]="section.content['shapeType'] || 'blob'"
      [customPath]="section.content['customPath']"
      [customStyles]="section.content['shapeStyles'] || {}"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_shape'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_shape', section.content, 'shape'))"
      [enhancedVisualEditable]="getShapeConfig()"
      elementId="{{section.id + '_shape'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleShapeEvent($event)"
      [style.position]="section.content['shapeStyles']?.['position'] || 'relative'"
      [style.width]="section.content['shapeStyles']?.['width'] || '100px'"
      [style.height]="section.content['shapeStyles']?.['height'] || '100px'"
      [style.left]="section.content['shapeStyles']?.['left']"
      [style.top]="section.content['shapeStyles']?.['top']"
    ></lib-ui-shape>
  </div>

  <!-- Isolated Mode Modal -->
  <lib-editor-shape-isolated-mode
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-shape-isolated-mode>
</section>

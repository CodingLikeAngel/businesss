<div #sectionElement
  class="editor-section cursor-pointer py-12 relative group"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleVisualEvent($event, section.id)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Card Product</span>
      <div class="h-4 w-[1px] bg-slate-200 mx-2"></div>
      <button (click)="openIsolatedMode($event)" class="bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full hover:bg-indigo-700 transition-colors uppercase tracking-widest shadow-lg shadow-indigo-200">
        Editor Avanzado 🛍️
      </button>
    </div>
  </div>

  <div class="container mx-auto px-6 max-w-sm">
    <lib-card-products #cardElement
      [product]="section.content['product'] || { name: 'Producto Pro', price: '$99', image: 'https://via.placeholder.com/300', description: 'Características premium e impacto visual.' }"
      [variant]="$any(getVariant(section.id))"
      [customStyles]="section.customStyles"
      [applyDynamicStyles]="section.styles"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_product_card'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_product_card', section.content, 'card-product'))"
      (dblclick)="openIsolatedMode($event)"
      [enhancedVisualEditable]="getElementConfig()"
      elementId="{{section.id + '_product_card'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleVisualEvent($event, section.id + '_product_card')">
    </lib-card-products>
  </div>

  <!-- Isolated Mode Overlay -->
  <lib-editor-card-product-isolated-mode
    *ngIf="showIsolatedMode"
    [config]="isolatedConfig!"
    (closed)="showIsolatedMode = false"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-card-product-isolated-mode>
</div>

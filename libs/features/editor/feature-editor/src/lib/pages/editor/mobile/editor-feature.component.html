<div class="sections-container min-h-screen relative pb-32">
  <div *ngIf="loading$ | async" class="flex items-center justify-center p-20">
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-white"
    ></div>
  </div>

  <div
    *ngIf="(sections$ | async)?.length === 0 && !(loading$ | async)"
    class="flex flex-col items-center justify-center p-10 text-white/50"
  >
    <div class="text-4xl mb-4">🏗️</div>
    <h2 class="text-xl font-bold">Página vacía</h2>
    <p class="text-xs text-center">
      Añade secciones desde el panel de Estructura.
    </p>
  </div>

  <ng-container
    *ngFor="let section of sections$ | async; trackBy: trackBySectionId"
  >
    <lib-editor-section-renderer
      *ngIf="section.visible"
      [section]="section"
      [componentVariants]="componentVariants"
      [globalVariant]="globalVariant"
      [heroConfig]="heroConfig"
      [featuresConfig]="featuresConfig"
      [statsConfig]="statsConfig"
      [galleryConfig]="galleryConfig"
      [titleConfig]="titleConfig"
      [chartConfig]="chartConfig"
      [navBarConfig]="navBarConfig"
      [footerConfig]="footerConfig"
      [bubbleConfig]="bubbleConfig"
      [cardConfig]="cardConfig"
      [serviceCardsConfig]="serviceCardsConfig"
      [faqConfig]="faqConfig"
      [pricingConfig]="pricingConfig"
      [promotionsConfig]="promotionsConfig"
      [productsConfig]="productsConfig"
      [testimonialsConfig]="testimonialsConfig"
      (elementMoved)="onElementMoved($event.bounds, $event.elementId, section)"
      (elementResized)="onElementResized($event.bounds, $event.elementId, section)"
      (sectionResized)="onSectionResized($event.section, $event.bounds)"
    >
    </lib-editor-section-renderer>
  </ng-container>
</div>

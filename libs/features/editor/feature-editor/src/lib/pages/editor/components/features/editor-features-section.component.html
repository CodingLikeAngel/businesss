<!-- DESKTOP FEATURES -->
<div *ngIf="!isMobile" class="editor-section cursor-pointer p-12"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [visualEditable]="true"
  visualType="section"
  (visualResized)="onSectionResized($event)">
  
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-16">
      <lib-ui-components-title
        [level]="section.content['level'] || 'h2'"
        [text]="section.content['title'] || 'Nuestros Servicios Premium'"
        [variant]="$any(getVariant(section.id))"
        [align]="'center'"
        class="editor-element"
        [class.is-selected]="selectedElementId === section.id + '_title'"
        (click)="selectElement($event, { id: section.id + '_title', sectionId: section.id, content: section.content, type: 'title' })"
        [applyDynamicStyles]="section.content['titleStyles']"
        [visualEditable]="true"
        visualType="element"
        (visualMoved)="onElementMoved($event, section.id + '_title')"
        (visualResized)="onElementResized($event, section.id + '_title')"
      ></lib-ui-components-title>
      
      <div class="mt-4">
        <p class="text-xl text-white/70 max-w-2xl mx-auto editor-element"
           [class.is-selected]="selectedElementId === section.id + '_subtitle'"
           (click)="selectElement($event, { id: section.id + '_subtitle', sectionId: section.id, content: section.content, type: 'subtitle' })"
           [applyDynamicStyles]="section.content['subtitleStyles']"
           [visualEditable]="true"
           visualType="element"
           (visualMoved)="onElementMoved($event, section.id + '_subtitle')"
           (visualResized)="onElementResized($event, section.id + '_subtitle')">
          {{ section.content['subtitle'] || 'Descubre cómo podemos ayudarte.' }}
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let feat of featuresConfig.items; let i = index"
           class="editor-element"
           [class.is-selected]="uiStateService.selectedElement?._original === feat"
           (click)="selectElement($event, getMergedElement(section.id, section.id + '_feature_' + i, feat, 'feature'))"
           [visualEditable]="true"
           visualType="element"
           (visualMoved)="onElementMoved($event, section.id + '_feature_' + i)"
           (visualResized)="onElementResized($event, section.id + '_feature_' + i)">
        <lib-ui-components-card-animated
          [icon]="feat.icon"
          [title]="feat.title"
          [description]="feat.description"
          [variant]="$any(feat.variant || getVariant(section.id))"
          [customStyles]="feat.styles || {}"
          [applyDynamicStyles]="feat.styles || {}"
          [animation]="'bounce'"
        ></lib-ui-components-card-animated>
      </div>
    </div>
  </div>
</div>

<!-- MOBILE FEATURES -->
<div *ngIf="isMobile" class="editor-section cursor-pointer p-6"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)">
  
  <div class="text-center mb-8">
    <h2 class="text-2xl font-bold text-white mb-2 editor-element"
        [class.is-selected]="selectedElementId === section.id + '_title'"
        (click)="selectElement($event, { id: section.id + '_title', content: section.content, type: 'title' })">
      {{ section.content['title'] || 'Servicios Premium' }}
    </h2>
  </div>

  <div class="space-y-4">
    <div *ngFor="let feat of featuresConfig.items" 
         class="editor-element"
         [class.is-selected]="uiStateService.selectedElement?._original === feat"
         (click)="selectElement($event, feat)">
      <lib-ui-components-card-animated
        [icon]="feat.icon"
        [title]="feat.title"
        [description]="feat.description"
        [variant]="$any(feat.variant || getVariant(section.id))"
        [customStyles]="feat.styles || {}"
        [animation]="'bounce'"
      ></lib-ui-components-card-animated>
    </div>
  </div>
</div>

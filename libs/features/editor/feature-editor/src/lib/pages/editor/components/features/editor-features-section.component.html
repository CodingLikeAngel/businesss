<!-- World-Class Features Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group relative py-16"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-10 bg-white/50 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-50 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-2">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Multimedia / Features v2</span>
      <div class="h-4 w-[1px] bg-slate-200 mx-2"></div>
      <button (click)="openIsolatedMode($event)" class="bg-indigo-600 text-white text-[9px] font-bold px-3 py-1 rounded-full hover:bg-indigo-700 transition-colors uppercase tracking-widest shadow-lg shadow-indigo-200 flex items-center gap-2">
        <span>🧩</span> EDITOR DE GRID PRO
      </button>
    </div>
  </div>

  <div class="container mx-auto px-6 max-w-7xl">
    <div class="text-center mb-16">
      <div class="editor-element mb-4"
           [class.is-selected]="selectedElementId === section.id + '_title'"
           (click)="selectElement($event, getMergedElement(section.id, section.id + '_title', section.content, 'title'))"
           [enhancedVisualEditable]="getTitleConfig()"
           elementId="{{section.id + '_title'}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleTitleEvent($event)">
        <lib-ui-components-title
          [level]="'h2'"
          [text]="section.content['title'] || 'Nuestras Características'"
          [variant]="$any(getVariant(section.id))"
          align="center"
        ></lib-ui-components-title>
      </div>
      
      <div class="editor-element opacity-80"
           [class.is-selected]="selectedElementId === section.id + '_subtitle'"
           (click)="selectElement($event, { id: section.id + '_subtitle', sectionId: section.id, type: 'subtitle', content: section.content })"
           [enhancedVisualEditable]="getSubtitleConfig()"
           elementId="{{section.id + '_subtitle'}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleSubtitleEvent($event)">
        <p class="text-xl max-w-2xl mx-auto">{{ section.content['subtitle'] || 'Innovación y diseño en cada detalle.' }}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-10"
         (dblclick)="openIsolatedMode($event)"
         title="Double click to edit grid layout">
      <div *ngFor="let feat of section.content['items']; let i = index"
           class="editor-element transform hover:scale-105 transition-transform duration-300"
           [class.is-selected]="selectedElementId === section.id + '_feature_' + i"
           (click)="selectElement($event, { id: section.id + '_feature_' + i, sectionId: section.id, type: 'feature', content: feat, index: i, isItem: true })"
           [enhancedVisualEditable]="getFeatureCardConfig()"
           elementId="{{section.id + '_feature_' + i}}"
           sectionId="{{section.id}}"
           (visualEvents)="handleFeatureCardEvent($event, i)">
        <lib-ui-components-card-animated
          [icon]="feat.icon"
          [title]="feat.title"
          [description]="feat.description"
          [variant]="$any(feat.variant || getVariant(section.id))"
        ></lib-ui-components-card-animated>
      </div>
    </div>
  </div>
</div>

<lib-editor-features-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="showIsolatedMode = false"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-features-isolated-mode>

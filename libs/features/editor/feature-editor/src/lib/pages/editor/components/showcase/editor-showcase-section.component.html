<section #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative py-20"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleEventStandalone($event, section.id)">
  <lib-editor-section-chrome
    sectionLabel="Showcase"
    sectionIcon="✨"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 relative">
    <div #showcaseElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_showcase'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_showcase', section.content, 'showcase'))"
       [enhancedVisualEditable]="getShowcaseConfig()"
       elementId="{{section.id + '_showcase'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleEventStandalone($event, section.id + '_showcase')"
       [style.position]="section.content['showcaseStyles']?.['position'] || 'relative'"
       [style.width]="section.content['showcaseStyles']?.['width'] || '100%'"
       [style.min-height]="section.content['showcaseStyles']?.['minHeight'] || '150px'"
       [style.left]="section.content['showcaseStyles']?.['left']"
       [style.top]="section.content['showcaseStyles']?.['top']"
    >
      <lib-ui-components-showcase-atom
        [icon]="section.content['icon'] || '✨'"
        [title]="section.content['title'] || 'Nueva Característica'"
        [text]="section.content['text'] || 'Explora cómo este beneficio puede mejorar tu flujo de trabajo diario.'"
        [layout]="section.content['layout'] || 'vertical'"
        [variant]="section.content['variant'] || getVariant(section.id)"
        [customStyles]="section.content['showcaseStyles'] || {}"
      ></lib-ui-components-showcase-atom>
    </div>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-showcase-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-showcase-isolated-mode>
</section>

<div #sectionElement class="editor-section cursor-pointer py-24"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
    <div #showcaseElement class="container mx-auto px-6 editor-element"
       [class.is-selected]="selectedElementId === section.id + '_showcase'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_showcase', section.content, 'showcase'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getShowcaseConfig()"
       elementId="{{section.id + '_showcase'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleShowcaseEvent($event)">
       <lib-ui-gaming-variants-showcase></lib-ui-gaming-variants-showcase>
    </div>
</div>

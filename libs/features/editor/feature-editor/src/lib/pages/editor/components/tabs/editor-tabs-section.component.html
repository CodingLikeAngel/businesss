<section #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative py-12"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="Tabs"
    sectionIcon="📑"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div #tabsElement class="container mx-auto px-6 max-w-4xl editor-element"
       [class.is-selected]="selectedElementId === section.id + '_tabs'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_tabs', section.content, 'tabs'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getTabsConfig()"
       elementId="{{section.id + '_tabs'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleTabsEvent($event)">
       <lib-ui-components-tabs
         [variant]="section.content['variant'] || getVariant(section.id)"
         [tabs]="section.content['tabs'] || [{ label: 'Tab 1', sectionId: 'tab1' }, { label: 'Tab 2', sectionId: 'tab2' }]"
         [orientation]="section.content['orientation'] || 'horizontal'"
         [customStyles]="section.styles || {}"
       ></lib-ui-components-tabs>
    </div>

  <!-- Isolated Mode Component -->
  <lib-editor-tabs-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-tabs-isolated-mode>
</section>

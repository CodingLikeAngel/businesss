<!-- CONSISTENT CONTACT EDITOR -->
<section #sectionElement [id]="section.id"
  class="relative z-20 cursor-pointer editor-section"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-contact-section
        [title]="section.content['title'] || '¡Contáctanos!'"
        [subtitle]="section.content['subtitle'] || 'Cuéntanos tu proyecto y te ayudaremos a hacerlo realidad.'"
        [infoTitle]="section.content['infoTitle'] || 'Información de Contacto'"
        [contactItems]="section.content['contactItems']"
        [variant]="$any(getVariant(section.id))"
        [customStyles]="section.styles"
    ></lib-ui-contact-section>

    <!-- Overlay invisibles para selección de elementos específicos si se desea granularidad extrema -->
    <!-- (Opcional, usualmente con la selección de sección basta si el componente es monolítico) -->
  </div>
</section>

<!-- DESKTOP FAQ -->
<section *ngIf="!isMobile" #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative py-12"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="FAQ"
    sectionIcon="❓"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div #faqElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_faq_wrapper'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_faq_wrapper', section.content, 'faq'))"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getFaqWrapperConfig()"
       elementId="{{section.id + '_faq_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleFaqWrapperEvent($event)">
    <lib-ui-faq-section
      [title]="section.content['title'] || 'Preguntas Frecuentes'"
      [subtitle]="section.content['subtitle'] || 'Respondemos tus dudas'"
      [items]="section.content['items'] || faqConfig.items"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-faq-section>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-faq-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-faq-isolated-mode>
</section>

<!-- MOBILE FAQ -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-2 p-2 group relative"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #faqElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_faq_wrapper'"
       (click)="selectElement($event, { id: section.id + '_faq_wrapper', content: section.content, type: 'faq' })"
       [applyDynamicStyles]="section.styles"
       [enhancedVisualEditable]="getFaqWrapperConfig()"
       elementId="{{section.id + '_faq_wrapper'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleFaqWrapperEvent($event)">
    <lib-ui-faq-section
      [title]="section.content['title'] || 'Preguntas Frecuentes'"
      [subtitle]="section.content['subtitle'] || 'Respondemos tus dudas'"
      [items]="section.content['items'] || faqConfig.items"
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [customStyles]="section.styles || {}"
      [applyDynamicStyles]="section.styles || {}"
    ></lib-ui-faq-section>
  </div>
</div>

<!-- DESKTOP IMAGE -->
<div *ngIf="!isMobile" class="editor-section cursor-pointer py-12"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [visualEditable]="true"
  visualType="section"
  (visualResized)="onSectionResized($event)">
  
  <div class="container mx-auto px-6 max-w-7xl">
    <lib-ui-image
      [src]="section.content['src'] || 'https://via.placeholder.com/800x600'"
      [alt]="section.content['alt'] || 'Image'"
      [variant]="getVariant(section.id)"
      [customStyles]="section.customStyles"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_image'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_image', section.content, 'image'))"
      [visualEditable]="true"
      visualType="element"
      (visualMoved)="onElementMoved($event, section.id + '_image')"
      (visualResized)="onElementResized($event, section.id + '_image')">
    </lib-ui-image>
  </div>
</div>

<!-- MOBILE IMAGE -->
<div *ngIf="isMobile" class="editor-section cursor-pointer py-8 p-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)">
  
  <lib-ui-image
    [src]="section.content['src'] || 'https://via.placeholder.com/600x400'"
    [alt]="section.content['alt'] || 'Image'"
    [variant]="getVariant(section.id)"
    class="editor-element w-full"
    [class.is-selected]="selectedElementId === section.id + '_image'"
    (click)="selectElement($event, { id: section.id + '_image', content: section.content, type: 'image' })">
  </lib-ui-image>
</div>

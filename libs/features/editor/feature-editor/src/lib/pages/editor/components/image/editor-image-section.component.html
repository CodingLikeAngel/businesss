<!-- Standardized Image Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group relative min-h-[400px]"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleEventStandalone($event, section.id)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-10 bg-white/50 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-20 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-4">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Multimedia / Imagen v2</span>
      <button 
        (click)="openIsolatedMode($event)"
        class="bg-emerald-500 hover:bg-emerald-600 text-white text-[9px] font-black px-3 py-1 rounded-full shadow-lg shadow-emerald-200 transition-all flex items-center gap-2">
        <span>FILTROS Y MÁSCARAS</span>
        <span class="bg-black/20 px-1.5 py-0.5 rounded text-[8px]">PRO</span>
      </button>
    </div>
  </div>

  <div class="container mx-auto px-6 max-w-7xl relative py-20 h-full min-h-[400px]">
    <lib-ui-image #imageElement
      [src]="section.content['src'] || 'https://via.placeholder.com/600x400'"
      [alt]="section.content['alt']"
      [size]="section.content['size'] || 'custom'"
      [width]="section.content['width']"
      [height]="section.content['height']"
      [variant]="$any(getVariant(section.id))"
      [shape]="section.content['shape'] || 'rounded'"
      [animation]="section.content['animation'] || 'fade'"
      [filter]="section.content['filter']"
      [objectFit]="section.content['objectFit'] || 'cover'"
      [objectPosition]="section.content['objectPosition'] || 'center'"
      [customStyles]="section.content['imageStyles'] || {}"
      class="editor-element"
      [style.clip-path]="section.content['imageStyles']?.['clip-path']"
      [class.is-selected]="selectedElementId === section.id + '_image'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_image', section.content, 'image'))"
      [enhancedVisualEditable]="getImageConfig()"
      elementId="{{section.id + '_image'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleEventStandalone($event, section.id + '_image')"
      [style.position]="section.content['imageStyles']?.['position'] || 'relative'"
      [style.width]="section.content['imageStyles']?.['width']"
      [style.height]="section.content['imageStyles']?.['height']"
      [style.left]="section.content['imageStyles']?.['left']"
      [style.top]="section.content['imageStyles']?.['top']"
    ></lib-ui-image>
  </div>

  <!-- Isolated Mode Component -->
  <lib-editor-image-isolated-mode 
    *ngIf="showIsolatedMode && isolatedConfig"
    [config]="isolatedConfig"
    (closed)="onIsolatedModeClosed()"
    (applied)="onIsolatedModeApplied($event)">
  </lib-editor-image-isolated-mode>
</div>

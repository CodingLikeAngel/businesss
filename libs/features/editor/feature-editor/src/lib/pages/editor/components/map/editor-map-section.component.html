<!-- Standardized Map Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group relative min-h-[500px]"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-10 bg-white/50 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity">
    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Multimedia / Mapa</span>
  </div>

  <div class="container mx-auto px-6 max-w-7xl relative py-20 h-full min-h-[500px]">
    <lib-ui-map #mapElement
      [address]="section.content['address'] || 'Madrid, Spain'"
      [zoom]="section.content['zoom'] || 14"
      [customStyles]="section.content['mapStyles'] || {}"
      [showOverlay]="true"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_map'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_map', section.content, 'map'))"
      [enhancedVisualEditable]="getMapConfig()"
      elementId="{{section.id + '_map'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleMapEvent($event)"
      [style.position]="section.content['mapStyles']?.['position'] || 'relative'"
      [style.width]="section.content['mapStyles']?.['width'] || '100%'"
      [style.height]="section.content['mapStyles']?.['height'] || '400px'"
      [style.left]="section.content['mapStyles']?.['left']"
      [style.top]="section.content['mapStyles']?.['top']"
    ></lib-ui-map>
  </div>
</div>

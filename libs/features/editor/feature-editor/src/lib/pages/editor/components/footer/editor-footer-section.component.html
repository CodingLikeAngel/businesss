<!-- Footer Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer py-2 transition-all duration-700"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #footerElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_footer'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_footer', section.content, 'footer'))"
       [enhancedVisualEditable]="getFooterConfig()"
       elementId="{{section.id + '_footer'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleFooterEvent($event)">
    
    <ng-container [ngSwitch]="section.config?.['subtype']">
      <!-- MEGA FOOTER -->
      <lib-ui-footer-mega *ngSwitchCase="'mega'"
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Mega Corp'"
        [description]="section.content['description'] || 'Innovative solutions for the modern world.'"
        [copyright]="section.content['copyright'] || '© 2024 All rights reserved.'"
        [socialIcons]="section.content['socialIcons'] || []"
        [linkGroups]="section.content['linkGroups'] || []"
        [showNewsletter]="section.content['showNewsletter'] !== false"
        [customStyles]="section.styles || {}"
      ></lib-ui-footer-mega>

      <!-- SIMPLE FOOTER -->
      <lib-ui-footer-simple *ngSwitchCase="'simple'"
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Company Name'"
        [copyright]="section.content['copyright'] || '© 2024 All rights reserved.'"
        [links]="section.content['links'] || []"
        [socialIcons]="section.content['socialIcons'] || []"
        [customStyles]="section.styles || {}"
      ></lib-ui-footer-simple>

      <!-- DEFAULT (Standard Footer) -->
      <lib-ui-components-footer *ngSwitchDefault
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Pie de Página'"
        [description]="section.content['description'] || 'Soluciones profesionales para empresas ambiciosas.'"
      ></lib-ui-components-footer>
    </ng-container>
  </div>
</div>

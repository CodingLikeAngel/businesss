<!-- Modern Footer Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer py-2 transition-all duration-700"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div #footerElement class="editor-element"
       [class.is-selected]="selectedElementId === section.id + '_footer'"
       (click)="selectElement($event, getMergedElement(section.id, section.id + '_footer', section.content, 'footer'))"
       [enhancedVisualEditable]="getFooterConfig()"
       elementId="{{section.id + '_footer'}}"
       sectionId="{{section.id}}"
       (visualEvents)="handleFooterEvent($event)">
    <lib-ui-components-footer
      [variant]="$any(section.content['variant'] || getVariant(section.id))"
      [title]="section.content['title'] || 'Pie de Página'"
      [description]="section.content['description'] || 'Soluciones profesionales para empresas ambiciosas.'"
    ></lib-ui-components-footer>
  </div>
</div>

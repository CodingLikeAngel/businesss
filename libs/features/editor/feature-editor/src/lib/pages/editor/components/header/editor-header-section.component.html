<div #sectionElement class="editor-section cursor-pointer"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
    
    <ng-container [ngSwitch]="section.config['subtype']">
      <!-- CLASSIC HEADER -->
      <lib-ui-components-header-classic *ngSwitchCase="'classic'"
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Classic Header'"
        [logo]="section.content['logoKey'] || null"
        [navItems]="section.content['navItems'] || []"
        [ctaLabel]="section.content['ctaLabel'] || 'Contact'"
        [customStyles]="section.styles || {}"
      ></lib-ui-components-header-classic>

      <!-- MODERN HEADER -->
      <lib-ui-components-header-modern *ngSwitchCase="'modern'"
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Modern Header'"
        [logo]="section.content['logoKey'] || null"
        [navItems]="section.content['navItems'] || []"
        [ctaLabel]="section.content['ctaLabel'] || 'Launch'"
        [customStyles]="section.styles || {}"
      ></lib-ui-components-header-modern>

      <!-- DEFAULT (Fallback) -->
      <lib-ui-components-header *ngSwitchDefault
        [variant]="$any(section.content['variant'] || getVariant(section.id))"
        [title]="section.content['title'] || 'Encabezado'"
        [subtitle]="section.content['subtitle'] || ''"
        [navItems]="section.content['navItems'] || []"
        [customStyles]="section.styles || {}"
      ></lib-ui-components-header>
    </ng-container>
</div>

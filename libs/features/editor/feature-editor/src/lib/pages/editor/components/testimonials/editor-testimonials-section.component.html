<!-- Premium Testimonials Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-700 group relative py-16"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <!-- Section Quick Actions -->
  <div class="absolute top-0 left-0 right-0 h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-50 opacity-0 group-hover:opacity-100 transition-opacity">
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Testimonios</span>
      <div class="h-4 w-[1px] bg-slate-200 mx-2"></div>
      <button (click)="openIsolatedMode($event)" class="bg-indigo-600 text-white text-[10px] font-bold px-3 py-1.5 rounded-full hover:bg-indigo-700 transition-colors uppercase tracking-widest shadow-lg shadow-indigo-200 flex items-center gap-2">
        <span>🎯</span> EDITOR AVANZADO PRO
      </button>
    </div>
  </div>

  <div class="container mx-auto px-6 max-w-7xl">
    <div class="editor-element"
         [class.is-selected]="selectedElementId === section.id + '_testimonials_wrapper'"
         (click)="selectElement($event, getMergedElement(section.id, section.id + '_testimonials_wrapper', section.content, 'testimonials'))"
         [enhancedVisualEditable]="getTestimonialsWrapperConfig()"
         elementId="{{section.id + '_testimonials_wrapper'}}"
         sectionId="{{section.id}}"
         (visualEvents)="handleTestimonialsWrapperEvent($event)">
      <lib-ui-testimonials-section
        [title]="section.content['title'] || 'Lo que Dicen Nuestros Clientes'"
        [subtitle]="section.content['subtitle'] || 'Opiniones que nos inspiran a mejorar cada día'"
        [variant]="$any(getVariant(section.id))"
        [testimonials]="section.content['items'] || []"
      ></lib-ui-testimonials-section>
    </div>
  </div>
</div>

<lib-editor-testimonials-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="closeIsolatedMode()"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-testimonials-isolated-mode>

<!-- DESKTOP TESTIMONIALS -->
<div *ngIf="!isMobile" class="editor-section cursor-pointer"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [visualEditable]="true"
  visualType="section"
  (visualResized)="onSectionResized($event)">

  <lib-ui-testimonials-section
    [title]="section.content['title'] || 'Lo que dicen de nosotros'"
    [subtitle]="section.content['subtitle'] || 'Historias reales de éxito.'"
    [variant]="getVariant(section.id)"
    [customStyles]="section.styles || {}"
    [applyDynamicStyles]="section.styles"
    [testimonials]="testimonialsConfig.items">
  </lib-ui-testimonials-section>
</div>

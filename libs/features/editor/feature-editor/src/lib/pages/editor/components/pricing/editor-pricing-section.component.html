<!-- DESKTOP PRICING -->
<div *ngIf="!isMobile" class="editor-section cursor-pointer"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="createElementConfig('section')"
  elementId="{{section.id}}"
  (visualEvents)="handleVisualEvent($event, section.id)">

  <lib-ui-pricing-table-section
    [title]="section.content['title'] || 'Planes y Precios'"
    [subtitle]="section.content['subtitle'] || 'Elige el plan perfecto para ti.'"
    [variant]="getVariant(section.id)"
    [customStyles]="section.styles || {}"
    [applyDynamicStyles]="section.styles"
    [columns]="pricingConfig.columns"
    [rows]="pricingConfig.rows">
  </lib-ui-pricing-table-section>
</div>

<!-- MOBILE PRICING (Optional or Placeholder if missing in original) -->
<div *ngIf="isMobile" class="p-4 text-center text-white/50 border border-dashed border-white/20 rounded-xl m-4">
  La sección de Precios se edita mejor en escritorio.
</div>

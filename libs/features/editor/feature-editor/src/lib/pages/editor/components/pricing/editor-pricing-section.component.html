<section #sectionElement
  [id]="section.id"
  class="editor-section cursor-pointer transition-all duration-500 relative min-h-[600px]"
  [class.preview-mode]="isPreviewMode && !showEditorControls"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">
  <lib-editor-section-chrome
    sectionLabel="Pricing"
    sectionIcon="💰"
    [isPreviewMode]="isPreviewMode"
    [showEditorControls]="showEditorControls"
    editButtonTitle="Modo Aislado (I)"
    (editClick)="openIsolatedMode($event)"
    (togglePreview)="toggleEditorControlsInPreview()">
  </lib-editor-section-chrome>

  <div class="container mx-auto px-6 max-w-7xl relative py-20 h-full min-h-[600px]">
    <div
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_pricing_wrapper'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_pricing_wrapper', section.content, 'pricing'))"
      [enhancedVisualEditable]="getPricingWrapperConfig()"
      elementId="{{section.id + '_pricing_wrapper'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handlePricingWrapperEvent($event)"
      [style.position]="section.content['pricingStyles']?.['position'] || 'relative'"
      [style.width]="section.content['pricingStyles']?.['width']"
      [style.height]="section.content['pricingStyles']?.['height']"
      [style.left]="section.content['pricingStyles']?.['left']"
      [style.top]="section.content['pricingStyles']?.['top']"
    >
      <lib-ui-pricing-table-section
        [title]="section.content['title'] || 'Planes a tu Medida'"
        [subtitle]="section.content['subtitle'] || 'Escoge la solución perfecta para tu crecimiento'"
        [variant]="$any(getVariant(section.id))"
        [rows]="section.content['items'] || []"
        [customStyles]="section.content['pricingStyles'] || {}"
      ></lib-ui-pricing-table-section>
    </div>
  </div>
</section>

<lib-editor-pricing-isolated-mode 
  *ngIf="showIsolatedMode && isolatedConfig"
  [config]="isolatedConfig"
  (closed)="closeIsolatedMode()"
  (applied)="onIsolatedModeApplied($event)">
</lib-editor-pricing-isolated-mode>

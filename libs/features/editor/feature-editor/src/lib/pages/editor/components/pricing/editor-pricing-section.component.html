<!-- Elite Pricing Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer py-16 transition-all duration-700"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div class="container mx-auto px-6 max-w-7xl">
    <div class="editor-element"
         [class.is-selected]="selectedElementId === section.id + '_pricing_wrapper'"
         (click)="selectElement($event, getMergedElement(section.id, section.id + '_pricing_wrapper', section.content, 'pricing'))"
         [enhancedVisualEditable]="getPricingWrapperConfig()"
         elementId="{{section.id + '_pricing_wrapper'}}"
         sectionId="{{section.id}}"
         (visualEvents)="handlePricingWrapperEvent($event)">
      <lib-ui-pricing-table-section
        [title]="section.content['title'] || 'Planes a tu Medida'"
        [subtitle]="section.content['subtitle'] || 'Escoge la solución perfecta para tu crecimiento'"
        [variant]="$any(getVariant(section.id))"
        [rows]="section.content['items'] || []"
      ></lib-ui-pricing-table-section>
    </div>
  </div>
</div>

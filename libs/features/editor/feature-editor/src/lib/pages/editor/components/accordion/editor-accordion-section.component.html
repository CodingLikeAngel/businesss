<!-- Standardized Accordion Editor Section -->
<div
  #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group relative"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{ section.id }}"
  (visualEvents)="handleSectionEvent($event)"
>
  <!-- Section Header -->
  <div
    class="absolute top-0 left-0 right-0 h-12 bg-white/80 backdrop-blur-sm border-b border-slate-200 flex items-center justify-between px-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity"
  >
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-slate-500 uppercase tracking-wider"
        >Acordeón</span
      >
    </div>
    <button
      class="flex items-center gap-2 px-3 py-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded-md text-xs font-bold transition-all shadow-sm"
      (click)="openIsolatedMode($event)"
      title="Modo Aislado (I)"
    >
      <span>🎯</span>
      <span>Editar</span>
    </button>
  </div>

  <div class="container mx-auto px-6 max-w-4xl py-12 pt-20">
    <div
      class="editor-element mb-12"
      [class.is-selected]="selectedElementId === section.id + '_title'"
      (click)="
        selectElement(
          $event,
          getMergedElement(
            section.id,
            section.id + '_title',
            section.content,
            'title'
          )
        )
      "
      [enhancedVisualEditable]="getTitleConfig()"
      elementId="{{ section.id + '_title' }}"
      sectionId="{{ section.id }}"
      (visualEvents)="handleTitleEvent($event)"
    >
      <lib-ui-components-title
        [level]="'h2'"
        [text]="section.content['title'] || 'Preguntas Frecuentes'"
        [variant]="$any(getVariant(section.id))"
        align="center"
      ></lib-ui-components-title>
    </div>

    <div
      #accordionElement
      class="editor-element h-auto"
      [class.is-selected]="selectedElementId === section.id + '_accordion'"
      (click)="
        selectElement(
          $event,
          getMergedElement(
            section.id,
            section.id + '_accordion',
            section.content,
            'accordion'
          )
        )
      "
      [enhancedVisualEditable]="getAccordionConfig()"
      elementId="{{ section.id + '_accordion' }}"
      sectionId="{{ section.id }}"
      (visualEvents)="handleAccordionEvent($event)"
    >
      <lib-ui-components-accordion
        *ngIf="section.content['accordionVariant'] === 'accordion' || !section.content['accordionVariant']"
        [items]="section.content['items'] || []"
        [variant]="$any(getVariant(section.id))"
        [customStyles]="section.content['accordionStyles'] || {}"
      ></lib-ui-components-accordion>

      <lib-ui-components-accordion-1
        *ngIf="section.content['accordionVariant'] === 'accordion-1'"
        [items]="section.content['items'] || []"
        [variant]="$any(section.content['variant'] || getVariant(section.id) || 'secondary')"
        [rounded]="$any(section.content['rounded'] || 'md')"
        [size]="$any(section.content['size'] || 'md')"
        [dark]="section.content['dark'] || false"
        [customStyles]="section.content['accordionStyles'] || {}"
      ></lib-ui-components-accordion-1>

      <lib-ui-components-accordion-2
        *ngIf="section.content['accordionVariant'] === 'accordion-2'"
        [items]="section.content['items'] || []"
        [variant]="$any(section.content['variant'] || getVariant(section.id) || 'secondary')"
        [rounded]="$any(section.content['rounded'] || 'md')"
        [size]="$any(section.content['size'] || 'md')"
        [dark]="section.content['dark'] || false"
        [customStyles]="section.content['accordionStyles'] || {}"
      ></lib-ui-components-accordion-2>

      <lib-ui-components-accordion-3
        *ngIf="section.content['accordionVariant'] === 'accordion-3'"
        [items]="section.content['items'] || []"
        [variant]="$any(section.content['variant'] || getVariant(section.id) || 'secondary')"
        [rounded]="$any(section.content['rounded'] || 'md')"
        [size]="$any(section.content['size'] || 'md')"
        [dark]="section.content['dark'] || false"
        [customStyles]="section.content['accordionStyles'] || {}"
      ></lib-ui-components-accordion-3>
    </div>
  </div>
</div>

<!-- Isolated Mode Modal -->
<lib-editor-accordion-isolated-mode
  *ngIf="showIsolatedMode"
  [config]="isolatedConfig!"
  (closed)="closeIsolatedMode()"
  (applied)="applyIsolatedChanges($event)"
>
</lib-editor-accordion-isolated-mode>

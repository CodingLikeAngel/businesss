<!-- DESKTOP ACCORDION -->
<div *ngIf="!isMobile" #sectionElement
  class="editor-section cursor-pointer py-12"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="selectedSectionId === section.id ? getSectionStyles(section.styles) : {}"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div class="container mx-auto px-6 max-w-3xl relative">
    <lib-ui-components-title #titleElement *ngIf="section.content['title']"
      [level]="'h2'"
      [text]="section.content['title']"
      [variant]="getVariant(section.id)"
      [align]="'center'"
      class="mb-8 block editor-element"
      [class.is-selected]="selectedElementId === section.id + '_title'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_title', { content: section.content, styles: section.content['titleStyles'] }, 'title'))"
      [applyDynamicStyles]="section.content['titleStyles']"
      [enhancedVisualEditable]="getTitleConfig()"
      elementId="{{section.id + '_title'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleTitleEvent($event)">
    </lib-ui-components-title>

    <lib-ui-components-accordion #accordionElement
      [items]="section.content['items'] || [{ title: 'Accordion Item 1', content: 'Content 1' }, { title: 'Accordion Item 2', content: 'Content 2' }]"
      [variant]="section.content['variant'] || getVariant(section.id)"
      [customStyles]="section.content['accordionStyles'] || {}"
      class="editor-element"
      [class.is-selected]="selectedElementId === section.id + '_accordion'"
      (click)="selectElement($event, getMergedElement(section.id, section.id + '_accordion', { content: section.content, styles: section.content['accordionStyles'] }, 'accordion'))"
      [applyDynamicStyles]="section.content['accordionStyles']"
      [enhancedVisualEditable]="getAccordionConfig()"
      elementId="{{section.id + '_accordion'}}"
      sectionId="{{section.id}}"
      (visualEvents)="handleAccordionEvent($event)">
    </lib-ui-components-accordion>
  </div>
</div>

<!-- MOBILE ACCORDION -->
<div *ngIf="isMobile" #sectionElement
  class="editor-section cursor-pointer py-8 p-4"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="selectedSectionId === section.id ? getSectionStyles(section.styles) : {}"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <lib-ui-components-title #titleElement *ngIf="section.content['title']"
    [level]="'h3'"
    [text]="section.content['title']"
    [variant]="getVariant(section.id)"
    [align]="'center'"
    class="mb-6 block editor-element"
    [class.is-selected]="selectedElementId === section.id + '_title'"
    (click)="selectElement($event, { id: section.id + '_title', content: section.content, styles: section.content['titleStyles'], type: 'title', sectionId: section.id })"
    [applyDynamicStyles]="section.content['titleStyles']"
    [enhancedVisualEditable]="getTitleConfig()"
    elementId="{{section.id + '_title'}}"
    sectionId="{{section.id}}"
    (visualEvents)="handleTitleEvent($event)">
  </lib-ui-components-title>

  <lib-ui-components-accordion #accordionElement
    [items]="section.content['items'] || [{ title: 'Accordion Item 1', content: 'Content 1' }, { title: 'Accordion Item 2', content: 'Content 2' }]"
    [variant]="section.content['variant'] || getVariant(section.id)"
    [customStyles]="section.content['accordionStyles'] || {}"
    class="editor-element"
    [class.is-selected]="selectedElementId === section.id + '_accordion'"
    (click)="selectElement($event, { id: section.id + '_accordion', content: section.content, styles: section.content['accordionStyles'], type: 'accordion', sectionId: section.id })"
    [applyDynamicStyles]="section.content['accordionStyles']"
    [enhancedVisualEditable]="getAccordionConfig()"
    elementId="{{section.id + '_accordion'}}"
    sectionId="{{section.id}}"
    (visualEvents)="handleAccordionEvent($event)">
  </lib-ui-components-accordion>
</div>

<!-- Standardized Accordion Editor Section -->
<div #sectionElement
  class="editor-section cursor-pointer transition-all duration-500 group"
  [class.is-selected]="selectedSectionId === section.id"
  (click)="selectSection($event, section)"
  [applyDynamicStyles]="section.styles"
  [enhancedVisualEditable]="getSectionConfig()"
  sectionId="{{section.id}}"
  (visualEvents)="handleSectionEvent($event)">

  <div class="container mx-auto px-6 max-w-4xl py-12">
    <div class="editor-element mb-12"
         [class.is-selected]="selectedElementId === section.id + '_title'"
         (click)="selectElement($event, getMergedElement(section.id, section.id + '_title', section.content, 'title'))"
         [enhancedVisualEditable]="getTitleConfig()"
         elementId="{{section.id + '_title'}}"
         sectionId="{{section.id}}"
         (visualEvents)="handleTitleEvent($event)">
      <lib-ui-components-title
        [level]="'h2'"
        [text]="section.content['title'] || 'Preguntas Frecuentes'"
        [variant]="$any(getVariant(section.id))"
        align="center"
      ></lib-ui-components-title>
    </div>

    <div #accordionElement class="editor-element"
         [class.is-selected]="selectedElementId === section.id + '_accordion'"
         (click)="selectElement($event, getMergedElement(section.id, section.id + '_accordion', section.content, 'accordion'))"
         [enhancedVisualEditable]="getAccordionConfig()"
         elementId="{{section.id + '_accordion'}}"
         sectionId="{{section.id}}"
         (visualEvents)="handleAccordionEvent($event)">
      <lib-ui-components-accordion
        [items]="section.content['items'] || []"
        [variant]="$any(getVariant(section.id))"
      ></lib-ui-components-accordion>
    </div>
  </div>
</div>

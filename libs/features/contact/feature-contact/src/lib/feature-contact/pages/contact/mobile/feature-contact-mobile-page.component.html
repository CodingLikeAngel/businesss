<div >
  <lib-ui-components-header
    [title]="headerConfig.title"
    [subtitle]="headerConfig.subtitle"
    [variant]="selectedVariant"
    [align]="headerConfig.align"
    [dark]="headerConfig.dark"
    [navItems]="headerConfig.navItems"
  ></lib-ui-components-header>
</div>

<lib-bubble-animation [variant]="selectedVariant"></lib-bubble-animation>

<lib-forest-animation
  [variant]="selectedForestVariant()"
  [backgroundColor]="'rgba(11, 61, 11, 0.5)'"
  [mistEnabled]="true"
  [treeCount]="3"
  [mushroomCount]="2"
  [fireflyCount]="5"
  [leafCount]="3"
  [sporeCount]="3"
  [butterflyCount]="1"
  [lightBeamCount]="1"
  [lumCount]="1"
  [lianaCount]="0"
>
  <div class="relative min-h-screen overflow-hidden z-30">
    <div class="container mx-auto px-4 py-8 relative z-30">
      <section id="contacto" class="mb-8 relative z-10">
        <div class="bg-[rgba(255,255,255,0.1)] backdrop-blur-md p-4 rounded-lg">
          <lib-ui-components-title
            level="h2"
            text="Contáctanos"
            [variant]="selectedVariant"
            animation="bounce"
            align="center"
          ></lib-ui-components-title>
          <div class="z-50 px-4 py-8">
            <lib-contact-form [variant]="selectedVariant"></lib-contact-form>
          </div>
        </div>
      </section>
    </div>
  </div>
</lib-forest-animation>

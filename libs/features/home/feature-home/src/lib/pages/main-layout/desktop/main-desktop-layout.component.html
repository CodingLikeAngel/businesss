<div class="min-h-screen text-white flex flex-row bg-[#0f172a] builder-shell" [class.preview-active]="builderStep === 'preview'">
  
  <!-- Visual Builder Sidebar -->
  <aside 
    *ngIf="builderStep !== 'preview'"
    class="w-[450px] h-screen sticky top-0 border-r border-white/10 shadow-2xl z-40 bg-[#1e293b] overflow-y-auto shrink-0">
    <lib-variant-selector></lib-variant-selector>
  </aside>

  <!-- Preview Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden preview-area">
    
    <!-- Responsive Preview HUD (Top Bar) -->
    <div *ngIf="builderStep === 'preview'" class="preview-hud">
      <div class="hud-left">
        <button (click)="returnToEditor()" class="hud-back-btn">
          <span>⬅️</span> Volver
        </button>
      </div>
      
      <div class="hud-center">
        <div class="device-selector">
          <button (click)="setPreviewSize('desktop')" [class.active]="previewSize === 'desktop'" title="Vista Desktop">
            🖥️ <span>Desktop</span>
          </button>
          <button (click)="setPreviewSize('tablet')" [class.active]="previewSize === 'tablet'" title="Vista Tablet">
            tablet <span>Tablet</span>
          </button>
          <button (click)="setPreviewSize('mobile')" [class.active]="previewSize === 'mobile'" title="Vista Móvil">
            📱 <span>Móvil</span>
          </button>
        </div>
      </div>
      
      <div class="hud-right">
        <div class="hud-status">
          <span class="status-dot green"></span>
          Modo Previsualización
        </div>
      </div>
    </div>

    <!-- The "Iframe" Container for Preview -->
    <div class="preview-frame-container" [class.frame-active]="builderStep === 'preview'">
      
      <div class="preview-frame" 
           [class.frame-mobile]="previewSize === 'mobile'" 
           [class.frame-tablet]="previewSize === 'tablet'"
           [class.frame-desktop]="previewSize === 'desktop'">
        
        <div class="frame-content">
          <!-- Header -->
          <div *ngIf="headerConfig.visible">
            <lib-ui-components-header
              [variant]="getVariant('navbar')"
              [align]="headerConfig.align"
              [dark]="headerConfig.dark"
              [title]="headerConfig.title"
              [subtitle]="headerConfig.subtitle"
              [navItems]="headerConfig.navItems"
              [customStyles]="headerConfig.customStyles"
            ></lib-ui-components-header>
          </div>

          <!-- Navbar -->
          <div *ngIf="navBarConfig.visible" class="fixed absolute top-0 z-50 bg-black/50 backdrop-blur-md w-full">
            <lib-ui-components-tabs
              [tabs]="tabsConfig"
              [variant]="getVariant('navbar')"
              [showAs]="'tabs'"
              [isMobile]="true"
              (tabSelected)="onTabSelected($event)"
            ></lib-ui-components-tabs>
          </div>

          <router-outlet></router-outlet>

          <!-- Footer -->
          <lib-ui-components-footer
            *ngIf="footerConfig.visible"
            [variant]="getVariant('footer')"
            [dark]="footerConfig.dark"
            [showParticles]="footerConfig.showParticles"
            [title]="footerConfig.title"
            [description]="footerConfig.description"
            [exploreLinks]="footerConfig.exploreLinks"
            [trendLinks]="footerConfig.trendLinks"
            [socialIcons]="footerConfig.socialIcons"
            [copyrightText]="footerConfig.copyrightText"
            [customStyles]="footerConfig.customStyles"
            (linkClicked)="onLinkClick($event)"
            (socialClicked)="onSocialClick($event)"
          ></lib-ui-components-footer>
        </div>

      </div>
    </div>

    <!-- Mini Floating Return Button (Fallback) -->
    <button 
      *ngIf="builderStep === 'preview'"
      (click)="returnToEditor()"
      class="fixed bottom-6 right-6 z-[100] hud-float-btn"
      title="Volver al Editor"
    >
      ✏️
    </button>

  </main>
</div>

<div class="min-h-screen text-white flex flex-row bg-[#0f172a]">
  <!-- Visual Builder Sidebar -->
  <!-- Visual Builder Sidebar -->
  <aside 
    class="w-[450px] h-screen sticky top-0 border-r border-white/10 shadow-2xl z-40 bg-[#1e293b] overflow-y-auto shrink-0">
    <lib-variant-selector></lib-variant-selector>
  </aside>

  <!-- Preview Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden">
    <!-- Header -->
    <div *ngIf="headerConfig.visible">
      <lib-ui-components-header
        [variant]="getVariant('navbar')"
        [align]="headerConfig.align"
        [dark]="headerConfig.dark"
        [title]="headerConfig.title"
        [subtitle]="headerConfig.subtitle"
        [navItems]="headerConfig.navItems"
        [customStyles]="headerConfig.customStyles"
      ></lib-ui-components-header>
    </div>

          <!-- Navbar -->
          <div *ngIf="navBarConfig.visible" class="fixed absolute top-0 z-50 bg-black/50 backdrop-blur-md w-[52vw]">
            <lib-ui-components-tabs
              [tabs]="tabsConfig"
              [variant]="getVariant('navbar')"
              [showAs]="'tabs'"
              [isMobile]="true"
              (tabSelected)="onTabSelected($event)"
            ></lib-ui-components-tabs>
          </div>

      <router-outlet></router-outlet>


    <!-- Footer -->
    <lib-ui-components-footer
      *ngIf="footerConfig.visible"
      [variant]="getVariant('footer')"
      [dark]="footerConfig.dark"
      [showParticles]="footerConfig.showParticles"
      [title]="footerConfig.title"
      [description]="footerConfig.description"
      [exploreLinks]="footerConfig.exploreLinks"
      [trendLinks]="footerConfig.trendLinks"
      [socialIcons]="footerConfig.socialIcons"
      [copyrightText]="footerConfig.copyrightText"
      [customStyles]="footerConfig.customStyles"
      (linkClicked)="onLinkClick($event)"
      (socialClicked)="onSocialClick($event)"
    ></lib-ui-components-footer>
  </main>
</div>
